<title>The Volt Circuit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=DM+Mono:wght@400;500&display=swap">

<style>
/* ─────────────────────────────────────────────
   THE KANTO CIRCUIT — LET'S GO, PIKACHU!
   Display  Baloo 2      — rounded, game-logo lineage
   Body     Nunito       — rounded humanist, long-form safe
   Data     DM Mono      — numeric columns only
   Colour   Pokedex blue / Poke Ball red / Pikachu volt
   ───────────────────────────────────────────── */
:root{
  --bg:#EEF3F9; --surface:#FFFFFF; --surface2:#E4EBF5; --sunk:#D5DFEC;
  --line:#D2DCEA; --line-soft:#E4EAF3;
  --ink:#16202E; --ink2:#48586E; --ink3:#5A6B82;
  --gold:#B27C08; --gold-ink:#7E5602; --gold-wash:#FCEFC8;
  --indigo:#1F63A8; --indigo-wash:#DCEAF8;
  --ember:#C22C0B; --ember-wash:#FBE0D8;
  --good:#17714F; --good-wash:#D8EFE3;
  --volt:#8A6206; --volt-wash:#FBEECC;
  /* the emblem is a logo — identical in both themes */
  --ball-top:#EE1515; --ball-band:#22262E; --ball-bot:#FFFFFF;
  --shadow:0 1px 2px rgba(22,32,46,.06), 0 10px 26px -18px rgba(22,32,46,.45);
  --shadow-lg:0 2px 4px rgba(22,32,46,.06), 0 18px 40px -24px rgba(22,32,46,.5);
  --r-card:14px; --r-sm:9px; --r-pill:999px;
  --rail:268px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D131E; --surface:#161F2E; --surface2:#1F2A3B; --sunk:#0A0F18;
    --line:#2B3849; --line-soft:#222D3D;
    --ink:#EAF1F9; --ink2:#AEBECF; --ink3:#8A9BB1;
    --gold:#F0B93F; --gold-ink:#FFD173; --gold-wash:#3A2C0C;
    --indigo:#71ACEA; --indigo-wash:#152233;
    --ember:#FF8464; --ember-wash:#3A1810;
    --good:#5FC79B; --good-wash:#102C22;
    --volt:#FFD84D; --volt-wash:#33290A;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 30px -20px rgba(0,0,0,.9);
    --shadow-lg:0 2px 6px rgba(0,0,0,.55), 0 22px 46px -26px rgba(0,0,0,1);
  }
}
:root[data-theme="dark"]{
  --bg:#0D131E; --surface:#161F2E; --surface2:#1F2A3B; --sunk:#0A0F18;
  --line:#2B3849; --line-soft:#222D3D;
  --ink:#EAF1F9; --ink2:#AEBECF; --ink3:#8A9BB1;
  --gold:#F0B93F; --gold-ink:#FFD173; --gold-wash:#3A2C0C;
  --indigo:#71ACEA; --indigo-wash:#152233;
  --ember:#FF8464; --ember-wash:#3A1810;
  --good:#5FC79B; --good-wash:#102C22;
  --volt:#FFD84D; --volt-wash:#33290A;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 30px -20px rgba(0,0,0,.9);
  --shadow-lg:0 2px 6px rgba(0,0,0,.55), 0 22px 46px -26px rgba(0,0,0,1);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Nunito","Segoe UI",Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.6; font-weight:400;
}
h1,h2,h3,h4,.dsp{font-family:"Baloo 2","Nunito",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.005em;text-wrap:balance;line-height:1.18;margin:0}
.mono,code,kbd,td.num,.num{font-family:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
code,kbd{background:var(--surface2);border-radius:5px;padding:1px 5px;font-size:.88em}
a{color:var(--indigo);text-underline-offset:2px;font-weight:600}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* the Poke Ball emblem, drawn in CSS */
.ball{display:inline-block;border-radius:50%;flex:0 0 auto;
  background:
    radial-gradient(circle at 50% 50%, var(--ball-bot) 0 20%, var(--ball-band) 20% 30%, transparent 30%),
    linear-gradient(180deg, var(--ball-top) 0 44%, var(--ball-band) 44% 56%, var(--ball-bot) 56% 100%);
  box-shadow:inset 0 0 0 1.5px var(--ball-band);
}

/* ── shell ── */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);max-width:1460px;margin:0 auto;min-height:100vh}
.rail{
  position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border-right:1px solid var(--line);padding:20px 0 40px;
}
.rail::-webkit-scrollbar{width:9px}
.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.scrim{position:fixed;inset:0;background:rgba(6,12,22,.55);z-index:55;display:none}

.brand{padding:0 20px 16px;border-bottom:1px solid var(--line-soft);margin-bottom:14px}
.brand .wing{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--volt);margin-bottom:7px}
.brand .wing .ball{width:16px;height:16px}
.brand h1{font-size:26px;line-height:1.02}
.brand p{margin:7px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.45}

.meter{display:flex;align-items:center;gap:9px;padding:10px 20px 14px}
.meter .bar{flex:1;height:9px;background:var(--sunk);border-radius:var(--r-pill);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.14)}
.meter .bar i{display:block;height:100%;width:0;border-radius:var(--r-pill);transition:width .35s ease;
  background-color:var(--gold);
  background-image:linear-gradient(180deg,#FFD84D 0%,var(--gold) 60%,#9A6B05 100%)}
.meter .pct{font-family:"DM Mono",monospace;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}

.navgroup{margin:0 0 6px}
.navgroup > .ghead{
  display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;
  padding:11px 20px 5px;background:none;border:0;
  font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
}
.navgroup > .ghead .gcount{margin-left:auto;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums;font-family:"DM Mono",monospace}
.navlist{list-style:none;margin:0;padding:0}
.navlist a{
  display:flex;gap:9px;align-items:flex-start;margin:1px 10px;border-radius:var(--r-sm);
  padding:7px 11px;font-weight:600;font-size:14px;line-height:1.3;color:var(--ink2);text-decoration:none;
}
.navlist a:hover{color:var(--ink);background:var(--surface2)}
.navlist a.on{color:var(--ink);background:var(--gold-wash);box-shadow:inset 0 0 0 1.5px var(--gold)}
.navlist a .tick{flex:0 0 auto;width:14px;height:14px;margin-top:3px;border:2px solid var(--line);border-radius:50%;background:var(--surface)}
.navlist a.done .tick{border:0;
  background:radial-gradient(circle at 50% 50%, var(--ball-bot) 0 20%, var(--ball-band) 20% 32%, transparent 32%),
             linear-gradient(180deg, var(--ball-top) 0 44%, var(--ball-band) 44% 56%, var(--ball-bot) 56% 100%);
  box-shadow:inset 0 0 0 1.5px var(--ball-band)}
.navlist a .n{font-family:"DM Mono",monospace;font-size:11px;color:var(--ink3);margin-top:1px}

/* ── main ── */
.main{min-width:0;padding:0 0 120px}
.topbar{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 95%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;gap:10px;align-items:center;padding:11px 28px;flex-wrap:wrap;
}
.menubtn{display:none}
.searchwrap{position:relative;flex:1;min-width:180px;max-width:420px}
.searchwrap input{
  width:100%;padding:9px 12px 9px 34px;border:2px solid var(--line);border-radius:var(--r-pill);
  background:var(--surface);color:var(--ink);font-family:inherit;font-size:14px;font-weight:600;
}
.searchwrap input:focus{border-color:var(--indigo);outline:none}
.searchwrap input::placeholder{color:var(--ink3);font-weight:400}
.searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink3);fill:none;stroke-width:2.4}
.tbtn{
  border:2px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:7px 14px;cursor:pointer;
  font-size:12.5px;font-weight:800;letter-spacing:.02em;color:var(--ink2);white-space:nowrap;
}
.tbtn:hover{border-color:var(--gold);color:var(--ink)}
.tbtn[aria-pressed="true"]{background:var(--gold-wash);border-color:var(--gold);color:var(--gold-ink)}
.daypick{
  border:2px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:7px 11px;
  font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;
}
.daypick:hover{border-color:var(--gold)}

.wrap{padding:0 28px;max-width:920px}
.wrap.wide{max-width:1100px}

/* ── stages ── */
.stage{padding:44px 0 8px;border-bottom:1px solid var(--line-soft);scroll-margin-top:70px}
.stage:last-child{border-bottom:0}
.stage.hide{display:none}
.eyebrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:13px}
.eyebrow .tag{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#fff;
  background-color:#2A6FB8;
  background-image:linear-gradient(135deg,#2A6FB8,#1B4478);
  padding:5px 12px;border-radius:var(--r-pill)}
.eyebrow .where{font-size:12.5px;font-weight:700;color:var(--ink3)}
.stage h2{font-size:clamp(28px,3.6vw,38px);margin-bottom:10px}
.lede{font-size:18.5px;color:var(--ink2);margin:0 0 22px;max-width:66ch}
.stage p{max-width:68ch}
.stage h3{font-size:12.5px;font-weight:800;text-transform:uppercase;color:var(--ink3);margin:32px 0 10px;letter-spacing:.12em}
.stage ul.plain{max-width:68ch;padding-left:22px;margin:10px 0}
.stage ul.plain li{margin:6px 0}

.band{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;margin:0 0 24px;background:var(--surface);box-shadow:var(--shadow)}
.band div{padding:11px 16px;border-right:1px solid var(--line-soft);flex:1;min-width:132px}
.band div:last-child{border-right:0}
.band dt{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.band dd{margin:0;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.2}

/* ── checklists ── */
.checks{list-style:none;margin:12px 0 6px;padding:0;max-width:70ch}
.checks li{display:flex;gap:11px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.checks li:last-child{border-bottom:0}
.checks input{
  appearance:none;-webkit-appearance:none;flex:0 0 auto;margin:4px 0 0;
  width:19px;height:19px;border:2px solid var(--line);border-radius:50%;background:var(--surface);cursor:pointer;position:relative;
}
.checks input:hover{border-color:var(--gold)}
.checks input:checked{border:0;
  background:radial-gradient(circle at 50% 50%, var(--ball-bot) 0 21%, var(--ball-band) 21% 31%, transparent 31%),
             linear-gradient(180deg, var(--ball-top) 0 44%, var(--ball-band) 44% 56%, var(--ball-bot) 56% 100%);
  box-shadow:inset 0 0 0 2px var(--ball-band)}
.checks label{cursor:pointer;font-size:16.5px}
.checks input:checked ~ label{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line)}
.checks input:checked ~ .stepn{color:var(--line)}
.checks .sub{display:block;font-size:14.5px;color:var(--ink3);font-weight:600;margin-top:2px}
li.doneRow.hidden{display:none}

/* ── the route: an ordered walk you tick off, legs grouped by where you are ── */
.checks.route{position:relative;max-width:74ch;margin-top:14px}
.checks.route::before{
  content:"";position:absolute;left:9px;top:14px;bottom:14px;width:2px;
  background:var(--line-soft);border-radius:2px;z-index:0}
.checks.route li{position:relative;z-index:1;padding-left:0}
.checks.route .doneRow{padding:9px 0 9px 0}
.checks.route input{box-shadow:0 0 0 4px var(--bg)}
.checks.route input:checked{box-shadow:inset 0 0 0 2px var(--ball-band), 0 0 0 4px var(--bg)}
.checks.route .stepn{
  flex:0 0 auto;min-width:20px;margin-top:3px;font-size:13px;font-weight:800;
  color:var(--ink3);font-variant-numeric:tabular-nums;text-align:right}
.checks.route label{flex:1 1 auto}
/* leg header — the place you are standing for the steps beneath it */
.checks.route li.leg{
  border-bottom:0;padding:16px 0 5px;align-items:center;gap:10px}
.checks.route li.leg:first-child{padding-top:2px}
.checks.route .legn{
  flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--indigo);
  color:var(--bg);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 4px var(--bg);font-variant-numeric:tabular-nums}
.checks.route .legname{
  font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
.checks.route li.leg.hidden{display:none}
@media (max-width:520px){
  .checks.route .stepn{min-width:16px;font-size:12.5px}
  .checks.route label{font-size:16px}
}

/* ── callouts ── */
.note{border:2px solid var(--line);border-radius:var(--r-card);padding:14px 17px;margin:18px 0;background:var(--surface);max-width:70ch}
.note .lbl{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:5px}
.note p{margin:0;font-size:16px}
.note.tip{background:var(--indigo-wash);border-color:color-mix(in srgb,var(--indigo) 32%,transparent)}
.note.tip .lbl{color:var(--indigo)}
.note.warn{background:var(--ember-wash);border-color:color-mix(in srgb,var(--ember) 38%,transparent)}
.note.warn .lbl{color:var(--ember)}
.note.team{background:var(--gold-wash);border-color:color-mix(in srgb,var(--gold) 42%,transparent)}
.note.team .lbl{color:var(--gold-ink)}
.note.ver{background:var(--volt-wash);border-color:color-mix(in srgb,var(--volt) 40%,transparent)}
.note.ver .lbl{color:var(--volt)}

/* ── cards ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:11px;margin:12px 0}
.card{border:1px solid var(--line);border-radius:var(--r-card);padding:13px 15px;background:var(--surface);box-shadow:var(--shadow)}
.card .nm{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:16px;line-height:1.25;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.card .loc{font-size:12px;font-weight:700;color:var(--ink3);margin-top:4px;display:block}
.card .why{font-size:14.5px;color:var(--ink2);margin-top:6px;line-height:1.45}
.kchip{font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:var(--r-pill);background:var(--surface2);color:var(--ink2);text-transform:uppercase}
.kchip.tm{background:var(--indigo-wash);color:var(--indigo)}
.kchip.hm{background:var(--gold-wash);color:var(--gold-ink)}
.kchip.key{background:var(--ember-wash);color:var(--ember)}
.lgx{font-size:9.5px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:var(--r-pill);
  background:var(--volt-wash);color:var(--volt);text-transform:uppercase;white-space:nowrap;
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--volt) 40%,transparent)}
.lgx.spawn{background:var(--surface2);color:var(--ink3);box-shadow:inset 0 0 0 1.5px var(--line)}

/* ── gym leader / boss dossier: banded in the leader's type colour ── */
.boss{border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;margin:24px 0;background:var(--surface);box-shadow:var(--shadow-lg)}
.boss .bh{--tc:#8A8AA8;padding:16px 19px;display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;
  background-color:color-mix(in srgb,var(--tc) 50%,#000);
  background-image:linear-gradient(135deg,color-mix(in srgb,var(--tc) 50%,#000) 0%,color-mix(in srgb,var(--tc) 30%,#000) 100%);
  color:#fff}
.boss .bh h4{font-size:24px;color:#fff}
.boss .bh .role{font-size:12px;font-weight:700;color:rgba(255,255,255,.86)}
.boss .bh .badge{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.22);padding:4px 11px;border-radius:var(--r-pill)}
.tblwrap{overflow-x:auto}
.tblwrap table{min-width:540px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{
  font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
  text-align:left;padding:10px 15px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--surface2);
}
td{padding:9px 15px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
td.mon{font-family:"Baloo 2",sans-serif;font-weight:800;white-space:nowrap;font-size:15.5px}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink2);font-weight:500}
td.mv{color:var(--ink2);font-size:14px}
.boss .plan{padding:15px 19px;border-top:1px solid var(--line)}
.boss .plan ul{margin:8px 0 0;padding-left:21px}
.boss .plan li{margin:7px 0;font-size:16px}
.boss .plan .lbl{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}

/* ── type chips: one hue token drives both themes ── */
.t{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap;--tc:#8A8478;
  background:color-mix(in srgb,var(--tc) 30%,#FFFFFF);
  color:color-mix(in srgb,var(--tc) 42%,#0F0D0A)}
.ty-normal{--tc:#A8A878}.ty-fire{--tc:#F08030}.ty-water{--tc:#6890F0}.ty-electric{--tc:#E8B800}
.ty-grass{--tc:#5FB43C}.ty-ice{--tc:#5FBFBF}.ty-fighting{--tc:#C03028}.ty-poison{--tc:#A040A0}
.ty-ground{--tc:#C9A23C}.ty-flying{--tc:#8E7BE8}.ty-psychic{--tc:#F04A76}.ty-bug{--tc:#8FA018}
.ty-rock{--tc:#B8A038}.ty-ghost{--tc:#705898}.ty-dragon{--tc:#7038F8}.ty-dark{--tc:#6B5344}
.ty-steel{--tc:#8A8AA8}.ty-fairy{--tc:#D468A6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .t{
  background:color-mix(in srgb,var(--tc) 24%,#000000);
  color:color-mix(in srgb,var(--tc) 60%,#FFFFFF)}}
:root[data-theme="dark"] .t{
  background:color-mix(in srgb,var(--tc) 24%,#000000);
  color:color-mix(in srgb,var(--tc) 60%,#FFFFFF)}

/* damage-class chips — in LGPE this is a property of the MOVE, never the type */
.dc{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 7px;border-radius:var(--r-pill);white-space:nowrap;vertical-align:1px}
.dc.phy{background:var(--ember-wash);color:var(--ember);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ember) 34%,transparent)}
.dc.sta{background:var(--surface2);color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--line)}
.dc.spe{background:var(--indigo-wash);color:var(--indigo);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--indigo) 34%,transparent)}

/* ── reference tables ── */
.reftable{border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;background:var(--surface);margin:18px 0;box-shadow:var(--shadow)}
.reftable .rh{display:flex;gap:10px;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line);background:var(--surface2);flex-wrap:wrap}
.reftable .rh input{flex:1;min-width:150px;padding:7px 13px;border:2px solid var(--line);border-radius:var(--r-pill);background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;font-weight:600}
.reftable td .have{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:2px solid var(--line);border-radius:50%;background:var(--bg);cursor:pointer;position:relative;vertical-align:-3px}
.reftable td .have:checked{border:0;
  background:radial-gradient(circle at 50% 50%, var(--ball-bot) 0 21%, var(--ball-band) 21% 31%, transparent 31%),
             linear-gradient(180deg, var(--ball-top) 0 44%, var(--ball-band) 44% 56%, var(--ball-bot) 56% 100%);
  box-shadow:inset 0 0 0 2px var(--ball-band)}
tr.rowhide{display:none}

/* ── repeatables board ── */
.dayboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:16px 0}
.daycard{border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);padding:14px 16px;box-shadow:var(--shadow)}
.daycard.today{border:2px solid var(--gold);background:var(--gold-wash)}
.daycard h4{font-size:17px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.daycard h4 .mk{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}
.daycard ul{margin:0;padding-left:19px;font-size:14.5px}
.daycard li{margin:5px 0;line-height:1.45}

/* ── team planner ── */
.planner{border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);padding:18px 20px;margin:18px 0;box-shadow:var(--shadow)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0 4px}
.slot{border:2px dashed var(--line);border-radius:var(--r-card);padding:10px 12px;min-height:66px;position:relative;background:var(--bg)}
.slot.filled{border-style:solid;background:var(--surface2)}
.slot .sn{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:15.5px}
.slot .st{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
.slot .x{position:absolute;top:4px;right:6px;border:0;background:none;cursor:pointer;color:var(--ink3);font-size:16px;line-height:1;padding:2px 4px}
.slot .x:hover{color:var(--ember)}
.slot .empty{color:var(--ink3);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.pool{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;max-height:190px;overflow-y:auto;padding:2px}
.pool button{
  border:2px solid var(--line);background:var(--bg);border-radius:var(--r-pill);padding:5px 13px;cursor:pointer;
  font-family:inherit;font-weight:700;font-size:13px;
}
.pool button:hover{border-color:var(--gold);background:var(--gold-wash)}
.pool button[disabled]{opacity:.42;cursor:default}
.cover{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:7px;margin-top:14px}
.cvcell{border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:8px 10px;background:var(--bg)}
.cvcell .cvt{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.cvcell .cvv{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:15px;margin-top:2px}
.cvcell.bad{background:var(--ember-wash)}
.cvcell.ok{background:var(--good-wash)}

/* ── the single next action ── */
.donow{border:2px solid var(--gold);border-radius:var(--r-card);background-color:var(--gold-wash);background-image:linear-gradient(135deg,var(--gold-wash),color-mix(in srgb,var(--gold-wash) 55%,var(--surface)));padding:15px 18px;margin:4px 0 18px;box-shadow:var(--shadow)}
.donow .lbl{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:7px}
.donow .lbl::before{content:"";width:13px;height:13px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, var(--ball-bot) 0 20%, var(--ball-band) 20% 32%, transparent 32%),
             linear-gradient(180deg, var(--ball-top) 0 44%, var(--ball-band) 44% 56%, var(--ball-bot) 56% 100%);
  box-shadow:inset 0 0 0 1.5px var(--ball-band)}
.donow p{margin:0;font-size:18px;line-height:1.42;font-family:"Baloo 2",sans-serif;font-weight:600;color:var(--ink);max-width:68ch}

/* ── party roster board ── */
.party{border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);margin:4px 0 26px;overflow:hidden;box-shadow:var(--shadow)}
.party .ph{padding:14px 17px;border-bottom:1px solid var(--line);background:var(--surface2);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.party .ph h4{font-size:18px}
.party .ph .lv{font-family:"DM Mono",ui-monospace,monospace;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.party .ph .who{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#fff;background-color:#C42B0B;background-image:linear-gradient(135deg,#C42B0B,#8E1E06);padding:4px 11px;border-radius:var(--r-pill)}
.party .psum{padding:14px 17px 0;margin:0;font-size:15.5px;color:var(--ink2);max-width:70ch}
.party .pnote{margin:14px 17px 0;padding:11px 14px;border-radius:var(--r-sm);background:var(--indigo-wash)}
.party .pnote .lbl{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--indigo);display:block;margin-bottom:4px}
.party .pnote p{margin:0;font-size:15.5px}
/* ── party: what you are carrying right now ── */
.party .have{display:flex;flex-direction:column;gap:7px;padding:13px 17px 0}
.haverow{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.hlbl{flex:0 0 auto;font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap}
.hlbl.ok{background:var(--good-wash);color:var(--good);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--good) 34%,transparent)}
.hlbl.out{background:var(--ember-wash);color:var(--ember);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ember) 34%,transparent)}
.hlbl.box{background:var(--indigo-wash);color:var(--indigo);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--indigo) 34%,transparent)}
.hlist{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.hmon{display:inline-flex;align-items:center;gap:3px;font-family:"Baloo 2",sans-serif;font-weight:800;
  font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r-pill);padding:2px 11px 2px 3px;white-space:nowrap}
.hmon.out{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--ember)}
.hmon.box{color:var(--ink2)}
.hmon .hspr{width:26px;height:26px;flex:0 0 auto;image-rendering:pixelated}
.hnone{color:var(--ink3);font-size:14px}

/* ── slot pairing line ── */
.ppair{margin-top:9px;font-size:13px;font-weight:700;line-height:1.35;
  border-top:1px dashed var(--line);padding-top:8px;position:relative;z-index:1}
.ppair span{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  display:inline-block;margin-right:5px}
.ppair.out{color:var(--ember)}
.ppair.out span{color:var(--ink3)}
.ppair.out::before{content:"→ ";font-weight:800}
.ppair.in{color:var(--good)}
.ppair.in span{color:var(--ink3)}
.ppair.in::before{content:"↩ ";font-weight:800}

/* ── move changes table ── */
.mvwrap{margin:6px 17px 17px;border:1px solid var(--line);border-radius:var(--r-card);
  overflow:hidden;background:var(--bg)}
.mvhead{padding:10px 15px;font-size:10.5px;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink2);background:var(--surface2);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px}
.mvhead::before{content:"";width:11px;height:11px;border-radius:2px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--gold),color-mix(in srgb,var(--gold) 55%,#000))}
.mvtable{min-width:560px;font-size:14px}
.mvtable th{background:var(--bg)}
.mvtable td{padding:8px 15px}
td.mvnew{font-weight:700;color:var(--good);white-space:nowrap}
td.mvold{color:var(--ember);white-space:nowrap}
:root[data-theme="dark"] .mvwrap{background:var(--sunk)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mvwrap{background:var(--sunk)}}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:11px;padding:15px 17px 17px}
.pslot{border:1px solid var(--line);border-radius:var(--r-card);padding:12px 14px;background:var(--bg)}
.pslot .pst{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:var(--r-pill);display:inline-block;margin-bottom:8px;background:var(--surface2);color:var(--ink2)}
.pslot.add{border:2px solid var(--gold)}
.pslot.add .pst{background:var(--gold);color:#241900}
.pslot.swap{border:2px solid var(--ember)}
.pslot.swap .pst{background:var(--ember-wash);color:var(--ember)}
.pslot.sit .pst{background:var(--indigo-wash);color:var(--indigo)}
.pslot.box{opacity:.86}
.pslot.box .pst{background:var(--surface2);color:var(--ink3);box-shadow:inset 0 0 0 1.5px var(--line)}
.hlbl.rest{background:var(--indigo-wash);color:var(--indigo);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--indigo) 34%,transparent)}
.pslot .pn{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:16.5px;line-height:1.2;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.pslot .prole{font-size:11px;font-weight:700;color:var(--ink3);margin-top:5px;text-transform:uppercase;letter-spacing:.05em}
.pslot .pw{font-size:14.5px;color:var(--ink2);margin-top:8px;line-height:1.45}

/* ── imagery: LGPE has no 2D game sprites — these are 3D model renders,
      so they are scaled smoothly. Only the trainer VS portraits are pixel art. ── */
img{max-width:100%}
.por{image-rendering:pixelated;image-rendering:crisp-edges}

.card.hasart,.pslot.hasart{position:relative;overflow:hidden}
.card.hasart .nm,.pslot.hasart .pn{padding-right:62px}
.spr{position:absolute;right:8px;top:8px;width:62px;height:62px;z-index:2;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.28))}
.sprbg{position:absolute;right:-26px;bottom:-30px;width:138px;height:138px;opacity:.11;z-index:0;pointer-events:none}
:root[data-theme="dark"] .sprbg{opacity:.15}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sprbg{opacity:.15}}
.card.hasart .nm,.card.hasart .loc,.card.hasart .why,
.pslot.hasart .pst,.pslot.hasart .pn,.pslot.hasart .prole,.pslot.hasart .pw{position:relative;z-index:1}
.pslot.hasart .spr{top:7px;right:7px;width:58px;height:58px}

td.mon .ms{width:34px;height:34px;vertical-align:-11px;margin-right:5px}
.card .isp{width:26px;height:26px;vertical-align:-7px;margin-right:3px}
.slot.filled{position:relative;padding-right:52px}
.slot.filled .spr{top:6px;right:6px;width:44px;height:44px}

.boss .bh.haspor{position:relative;padding-right:108px;min-height:100px;align-items:center}
.boss .bh.haspor .por{position:absolute;right:16px;top:50%;transform:translateY(-50%);height:82px;width:auto;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.55))}
@media (max-width:640px){
  .boss .bh.haspor{padding-right:74px}
  .boss .bh.haspor .por{height:62px;right:10px}
}

.mapfig{margin:0 0 26px;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;
  background:var(--surface);box-shadow:var(--shadow)}
.mapfig img{display:block;width:100%;height:auto;background:var(--surface2)}
.mapfig figcaption{padding:10px 15px;font-size:12.5px;font-weight:700;color:var(--ink2);
  border-top:1px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:var(--surface2)}
.mapfig figcaption span{margin-left:auto;font-size:11px;font-weight:700;color:var(--ink3);
  text-transform:uppercase;letter-spacing:.09em}

/* ── misc ── */
.footnote{font-size:14px;color:var(--ink3);max-width:70ch;margin-top:26px}
.srcs{font-size:13.5px;color:var(--ink3)}
.srcs a{color:var(--ink2)}
details.backup{border:1px solid var(--line);border-radius:var(--r-card);padding:12px 16px;background:var(--surface);margin:22px 0}
details.backup summary{cursor:pointer;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
details.backup textarea{width:100%;height:110px;margin-top:10px;font-family:"DM Mono",monospace;font-size:11px;border:2px solid var(--line);border-radius:var(--r-sm);background:var(--bg);color:var(--ink2);padding:9px}
.rowbtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.nores{padding:40px 0;color:var(--ink3);font-size:14px;font-weight:700}
.doneRow.hidden{display:none}

@media (max-width:960px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:290px;z-index:60;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow-lg)}
  .rail.open{transform:none}
  .menubtn{display:inline-flex;align-items:center;gap:6px}
  .scrim.on{display:block}
  .wrap{padding:0 18px}
  body{font-size:16.5px}
}
@media (max-width:480px){
  .topbar{padding:10px 16px;gap:8px}
  .pgrid,.grid{grid-template-columns:1fr}
}
</style>

  padding:14px 16px;box-shadow:var(--shadow);border-left:5px solid var(--tc,var(--indigo))}

  text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:7px}
