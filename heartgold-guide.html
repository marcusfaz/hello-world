<title>The Johto Circuit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=DM+Mono:wght@400;500&display=swap">

<style>
/* ─────────────────────────────────────────────
   THE JOHTO CIRCUIT — tokens
   Light palette on :root, redefined for the two
   dark states. Every colour comes from a token.
   ───────────────────────────────────────────── */
:root{
  --bg:#F4F2EC; --surface:#FBFAF6; --surface2:#EAE6DC; --sunk:#E3DFD2;
  --line:#DAD4C6; --line-soft:#E6E1D5;
  --ink:#1F1D18; --ink2:#575142; --ink3:#847C6A;
  --gold:#9E6D12; --gold-ink:#7A5309; --gold-wash:#F3E7C9;
  --indigo:#2C3E63; --indigo-wash:#DFE4EE;
  --ember:#9E3520; --ember-wash:#F5DFD9;
  --good:#2A6244; --good-wash:#DCEBE1;
  --shadow:0 1px 0 rgba(31,29,24,.05), 0 8px 24px -16px rgba(31,29,24,.35);
  --rail:268px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131210; --surface:#1B1915; --surface2:#22201A; --sunk:#100F0D;
    --line:#332F28; --line-soft:#2A2721;
    --ink:#F0EBDE; --ink2:#A79E8A; --ink3:#7E7664;
    --gold:#E0AC4C; --gold-ink:#EFC475; --gold-wash:#33280F;
    --indigo:#93ACDA; --indigo-wash:#1E2536;
    --ember:#E2856B; --ember-wash:#33201A;
    --good:#77C39A; --good-wash:#16281F;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#131210; --surface:#1B1915; --surface2:#22201A; --sunk:#100F0D;
  --line:#332F28; --line-soft:#2A2721;
  --ink:#F0EBDE; --ink2:#A79E8A; --ink3:#7E7664;
  --gold:#E0AC4C; --gold-ink:#EFC475; --gold-wash:#33280F;
  --indigo:#93ACDA; --indigo-wash:#1E2536;
  --ember:#E2856B; --ember-wash:#33201A;
  --good:#77C39A; --good-wash:#16281F;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Newsreader",Georgia,"Times New Roman",serif;
  font-size:17px; line-height:1.62;
  font-optical-sizing:auto;
}
h1,h2,h3,h4,.dsp{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;font-weight:800;letter-spacing:-.02em;text-wrap:balance;line-height:1.12;margin:0}
.mono,code,kbd,td.num,.num{font-family:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:var(--indigo);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:2px}
button{font:inherit;color:inherit}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ── shell: the two-screen layout ── */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);max-width:1460px;margin:0 auto;min-height:100vh}
.rail{
  position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border-right:1px solid var(--line);
  padding:20px 0 40px;
}
.rail::-webkit-scrollbar{width:9px}
.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:55;display:none}
.brand{padding:0 20px 16px;border-bottom:1px solid var(--line-soft);margin-bottom:14px}
.brand .wing{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:6px}
.brand h1{font-size:23px;line-height:1.05}
.brand p{margin:7px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.45}

.meter{display:flex;align-items:center;gap:9px;padding:10px 20px 14px}
.meter .bar{flex:1;height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}
.meter .pct{font-family:"DM Mono",monospace;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}

.navgroup{margin:0 0 6px}
.navgroup > .ghead{
  display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;
  padding:9px 20px 5px;background:none;border:0;cursor:pointer;
  font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);
}
.navgroup > .ghead .gcount{margin-left:auto;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.navlist{list-style:none;margin:0;padding:0}
.navlist a{
  display:flex;gap:9px;align-items:flex-start;
  padding:6px 20px 6px 20px;font-family:"Bricolage Grotesque",sans-serif;font-weight:500;
  font-size:14px;line-height:1.3;color:var(--ink2);text-decoration:none;border-left:2px solid transparent;
}
.navlist a:hover{color:var(--ink);background:var(--surface2)}
.navlist a.on{color:var(--ink);border-left-color:var(--gold);background:var(--gold-wash)}
.navlist a .tick{flex:0 0 auto;width:13px;height:13px;margin-top:3px;border:1.5px solid var(--line);border-radius:3px;background:var(--surface)}
.navlist a.done .tick{background:var(--gold);border-color:var(--gold);position:relative}
.navlist a.done .tick::after{content:"";position:absolute;left:3.5px;top:.5px;width:3px;height:7px;border:solid var(--surface);border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
.navlist a .n{font-family:"DM Mono",monospace;font-size:11px;color:var(--ink3);margin-top:1px}

/* ── main column ── */
.main{min-width:0;padding:0 0 120px}
.topbar{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 95%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;gap:10px;align-items:center;padding:10px 28px;flex-wrap:wrap;
}
.menubtn{display:none}
.searchwrap{position:relative;flex:1;min-width:180px;max-width:420px}
.searchwrap input{
  width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:5px;
  background:var(--surface);color:var(--ink);font-family:"Bricolage Grotesque",sans-serif;font-size:14px;
}
.searchwrap input::placeholder{color:var(--ink3)}
.searchwrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--ink3);fill:none;stroke-width:2}
.tbtn{
  border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 11px;cursor:pointer;
  font-family:"DM Mono",monospace;font-size:11.5px;letter-spacing:.04em;color:var(--ink2);white-space:nowrap;
}
.tbtn:hover{border-color:var(--gold);color:var(--ink)}
.tbtn[aria-pressed="true"]{background:var(--gold-wash);border-color:var(--gold);color:var(--gold-ink)}
.daypick{
  border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 9px;
  font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ink2);
}

.wrap{padding:0 28px;max-width:920px}
.wrap.wide{max-width:1100px}

/* ── stage sections ── */
.stage{padding:44px 0 8px;border-bottom:1px solid var(--line-soft);scroll-margin-top:64px}
.stage:last-child{border-bottom:0}
.stage.hide{display:none}
.eyebrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.eyebrow .tag{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold-wash);padding:3px 8px;border-radius:3px}
.eyebrow .where{font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ink3)}
.stage h2{font-size:clamp(26px,3.4vw,34px);margin-bottom:10px}
.lede{font-size:18.5px;color:var(--ink2);margin:0 0 22px;max-width:66ch}
.stage p{max-width:68ch}
.stage h3{font-size:12.5px;font-weight:500;text-transform:uppercase;color:var(--ink3);margin:30px 0 10px;font-family:"DM Mono",ui-monospace,monospace;letter-spacing:.13em}
.stage ul.plain{max-width:68ch;padding-left:20px;margin:10px 0}
.stage ul.plain li{margin:5px 0}

/* level band strip */
.band{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:0 0 24px;background:var(--surface)}
.band div{padding:9px 14px;border-right:1px solid var(--line-soft);flex:1;min-width:132px}
.band div:last-child{border-right:0}
.band dt{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.band dd{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}

/* checklists */
.checks{list-style:none;margin:12px 0 6px;padding:0;max-width:70ch}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dotted var(--line)}
.checks li:last-child{border-bottom:0}
.checks input{
  appearance:none;-webkit-appearance:none;flex:0 0 auto;margin:5px 0 0;
  width:16px;height:16px;border:1.5px solid var(--line);border-radius:4px;background:var(--surface);cursor:pointer;position:relative;
}
.checks input:hover{border-color:var(--gold)}
.checks input:checked{background:var(--gold);border-color:var(--gold)}
.checks input:checked::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:9px;border:solid var(--surface);border-width:0 1.8px 1.8px 0;transform:rotate(42deg)}
.checks label{cursor:pointer;font-size:16.5px}
.checks input:checked + label{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line)}
.checks .sub{display:block;font-size:14px;color:var(--ink3);font-family:"Bricolage Grotesque",sans-serif;font-weight:500;margin-top:1px}
li.doneRow.hidden{display:none}

/* callouts */
.note{border:1px solid var(--line);border-radius:6px;padding:13px 16px;margin:18px 0;background:var(--surface);max-width:70ch}
.note .lbl{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;display:block;margin-bottom:5px}
.note p{margin:0;font-size:16px}
.note.tip{background:var(--indigo-wash);border-color:transparent}
.note.tip .lbl{color:var(--indigo)}
.note.warn{background:var(--ember-wash);border-color:transparent}
.note.warn .lbl{color:var(--ember)}
.note.team{background:var(--gold-wash);border-color:transparent}
.note.team .lbl{color:var(--gold-ink)}

/* chip grids: catches & loot */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px;margin:12px 0}
.card{border:1px solid var(--line);border-radius:6px;padding:11px 13px;background:var(--surface)}
.card .nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.card .loc{font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ink3);margin-top:3px;display:block}
.card .why{font-size:14.5px;color:var(--ink2);margin-top:5px;line-height:1.45}
.kchip{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.08em;padding:2px 6px;border-radius:3px;background:var(--surface2);color:var(--ink2);text-transform:uppercase}
.kchip.tm{background:var(--indigo-wash);color:var(--indigo)}
.kchip.hm{background:var(--gold-wash);color:var(--gold-ink)}
.kchip.key{background:var(--ember-wash);color:var(--ember)}

/* boss dossier */
.boss{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:22px 0;background:var(--surface);box-shadow:var(--shadow)}
.boss .bh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;background:var(--surface2)}
.boss .bh h4{font-size:21px}
.boss .bh .role{font-family:"DM Mono",monospace;font-size:11px;color:var(--ink3);letter-spacing:.06em}
.boss .bh .badge{margin-left:auto;font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold-wash);padding:3px 8px;border-radius:3px}
.tblwrap{overflow-x:auto}
.tblwrap table{min-width:540px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{
  font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
  text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:400;
}
td{padding:8px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
td.mon{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink2)}
td.mv{color:var(--ink2);font-size:14px}
.boss .plan{padding:14px 18px;border-top:1px solid var(--line)}
.boss .plan ul{margin:8px 0 0;padding-left:19px}
.boss .plan li{margin:6px 0;font-size:16px}
.boss .plan .lbl{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3)}

/* type pills */
.t{display:inline-block;font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:1.5px 5px;border-radius:3px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.t.normal{background:#D8D2C2;color:#3B372C}.t.fire{background:#F3C9A4;color:#6B3208}.t.water{background:#BBD4EE;color:#153A63}
.t.electric{background:#F2DFA4;color:#5F4703}.t.grass{background:#C2DFB4;color:#2A4A1C}.t.ice{background:#BEE1E4;color:#164348}
.t.fighting{background:#E6BDAE;color:#5E2717}.t.poison{background:#D8BEDE;color:#4A2352}.t.ground{background:#E2D3AE;color:#54401A}
.t.flying{background:#CFD3EC;color:#2E3466}.t.psychic{background:#F2C3CE;color:#6B2038}.t.bug{background:#D3DFA8;color:#3F4A12}
.t.rock{background:#DCD0AF;color:#4E4118}.t.ghost{background:#C6BEDD;color:#372C55}.t.dragon{background:#C3C3EE;color:#2C2C66}
.t.dark{background:#C6BBB0;color:#332821}.t.steel{background:#CFD5DC;color:#2E3841}
:root[data-theme="dark"] .t, :root:not([data-theme="light"]) .t{filter:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .t{filter:brightness(.42) saturate(1.5);color:#F7F3E8!important}}
:root[data-theme="dark"] .t{filter:brightness(.42) saturate(1.5);color:#F7F3E8!important}

/* reference tables */
.reftable{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);margin:18px 0}
.reftable .rh{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface2);flex-wrap:wrap}
.reftable .rh input{flex:1;min-width:150px;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);font-family:"DM Mono",monospace;font-size:12.5px}
.reftable td .have{appearance:none;-webkit-appearance:none;width:15px;height:15px;border:1.5px solid var(--line);border-radius:3px;background:var(--bg);cursor:pointer;position:relative;vertical-align:-2px}
.reftable td .have:checked{background:var(--gold);border-color:var(--gold)}
.reftable td .have:checked::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--surface);border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
tr.rowhide{display:none}

/* day planner */
.dayboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:16px 0}
.daycard{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:12px 14px}
.daycard.today{border-color:var(--gold);background:var(--gold-wash)}
.daycard h4{font-size:15px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.daycard h4 .mk{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}
.daycard ul{margin:0;padding-left:17px;font-size:14.5px}
.daycard li{margin:4px 0;line-height:1.45}

/* team planner */
.planner{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:16px 18px;margin:18px 0}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:12px 0 4px}
.slot{border:1px dashed var(--line);border-radius:6px;padding:9px 11px;min-height:62px;position:relative;background:var(--bg)}
.slot.filled{border-style:solid;background:var(--surface2)}
.slot .sn{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14.5px}
.slot .st{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}
.slot .x{position:absolute;top:4px;right:5px;border:0;background:none;cursor:pointer;color:var(--ink3);font-size:15px;line-height:1;padding:2px 4px}
.slot .x:hover{color:var(--ember)}
.slot .empty{color:var(--ink3);font-family:"DM Mono",monospace;font-size:11px}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-height:190px;overflow-y:auto;padding:2px}
.pool button{
  border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 11px;cursor:pointer;
  font-family:"Bricolage Grotesque",sans-serif;font-weight:500;font-size:13px;
}
.pool button:hover{border-color:var(--gold);background:var(--gold-wash)}
.pool button[disabled]{opacity:.38;cursor:default}
.cover{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:6px;margin-top:14px}
.cvcell{border:1px solid var(--line-soft);border-radius:5px;padding:7px 9px;background:var(--bg)}
.cvcell .cvt{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.cvcell .cvv{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14px;margin-top:2px}
.cvcell.bad{background:var(--ember-wash)}
.cvcell.ok{background:var(--good-wash)}

/* misc */
.footnote{font-size:14px;color:var(--ink3);max-width:70ch;margin-top:26px}
.srcs{font-size:13.5px;color:var(--ink3)}
.srcs a{color:var(--ink2)}
details.backup{border:1px solid var(--line);border-radius:6px;padding:10px 14px;background:var(--surface);margin:22px 0}
details.backup summary{cursor:pointer;font-family:"DM Mono",monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
details.backup textarea{width:100%;height:110px;margin-top:10px;font-family:"DM Mono",monospace;font-size:11px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink2);padding:8px}
.rowbtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.nores{padding:40px 0;color:var(--ink3);font-family:"DM Mono",monospace;font-size:13px}

@media (max-width:960px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:290px;z-index:60;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow)}
  .rail.open{transform:none}
  .menubtn{display:inline-flex;align-items:center;gap:6px}
  .scrim.on{display:block}
  .wrap{padding:0 18px}
  body{font-size:16.5px}
}
</style>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Guide contents">
    <div class="brand">
      <span class="wing">Pokémon HeartGold · 100% route</span>
      <h1>The Johto Circuit</h1>
      <p>A stage-by-stage completion guide, built for a Steam Deck playthrough.</p>
    </div>
    <div class="meter" title="Overall completion">
      <div class="bar"><i id="globalbar"></i></div>
      <span class="pct" id="globalpct">0%</span>
    </div>
    <div id="nav"></div>
  </nav>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="topbar">
      <button class="tbtn menubtn" id="menubtn" aria-label="Open contents">☰ Contents</button>
      <div class="searchwrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <input id="search" type="search" placeholder="Search the guide — “Whitney”, “TM45”, “Heracross”…" autocomplete="off">
      </div>
      <select class="daypick" id="daypick" aria-label="In-game day"></select>
      <button class="tbtn" id="hidedone" aria-pressed="false">Hide done</button>
      <button class="tbtn" id="themebtn" aria-label="Toggle colour theme">◐</button>
    </div>
    <div id="content"></div>
  </main>
</div>
<script>
/* ============================================================
   Engine: data containers, persistence, rendering, widgets.
   Content is appended by the DATA scripts that follow.
   ============================================================ */
const CHAPTERS = [];
const STAGES = [];
const WIDGETS = {};                 // id -> function(mountEl)

/* ---- persistence (per-browser; export/import below) ---- */
const KEY = 'johto-circuit-v1';
let DONE = {};
try { DONE = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { DONE = {}; }
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(DONE)); } catch (e) {} }

/* stable id from text so progress survives edits elsewhere in the page */
function key(scope, text){
  let h = 5381;
  const s = scope + '|' + text;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return scope + '-' + h.toString(36);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tpill = t => '<span class="t ' + String(t).toLowerCase() + '">' + esc(t) + '</span>';
const tpills = a => (a || []).map(tpill).join(' ');

/* ---- block renderers ---- */
function renderBlock(b, stageId){
  const kind = b[0], v = b[1];
  switch (kind){
    case 'p':    return '<p>' + v + '</p>';
    case 'h':    return '<h3>' + esc(v) + '</h3>';
    case 'ul':   return '<ul class="plain">' + v.map(x => '<li>' + x + '</li>').join('') + '</ul>';
    case 'tip':  return '<div class="note tip"><span class="lbl">Worth knowing</span><p>' + v + '</p></div>';
    case 'warn': return '<div class="note warn"><span class="lbl">Don\'t miss / can\'t undo</span><p>' + v + '</p></div>';
    case 'team': return '<div class="note team"><span class="lbl">Team call</span><p>' + v + '</p></div>';
    case 'html': return v;
    case 'mount':return '<div data-widget="' + esc(v) + '"></div>';

    case 'do': return '<ul class="checks">' + v.map(item => {
        const t = typeof item === 'string' ? item : item.t;
        const sub = (typeof item === 'object' && item.sub) ? '<span class="sub">' + item.sub + '</span>' : '';
        const id = key(stageId, t);
        const on = !!DONE[id];
        return '<li class="doneRow' + (on ? ' isdone' : '') + '" data-k="' + id + '">' +
          '<input type="checkbox" id="' + id + '" data-k="' + id + '"' + (on ? ' checked' : '') + '>' +
          '<label for="' + id + '">' + t + sub + '</label></li>';
      }).join('') + '</ul>';

    case 'catch': return '<div class="grid">' + v.map(c =>
        '<div class="card"><div class="nm">' + esc(c.n) + ' ' + tpills(c.t) + '</div>' +
        '<span class="loc">' + esc(c.where) + '</span>' +
        (c.why ? '<div class="why">' + c.why + '</div>' : '') + '</div>').join('') + '</div>';

    case 'loot': return '<div class="grid">' + v.map(i => {
        const cls = /^TM/.test(i.k) ? 'tm' : /^HM/.test(i.k) ? 'hm' : i.k === 'Key' ? 'key' : '';
        return '<div class="card"><div class="nm"><span class="kchip ' + cls + '">' + esc(i.k) + '</span> ' + esc(i.n) + '</div>' +
          '<span class="loc">' + esc(i.where) + '</span>' + (i.why ? '<div class="why">' + i.why + '</div>' : '') + '</div>';
      }).join('') + '</div>';

    case 'table': return '<div class="reftable"><div class="tblwrap"><table><thead><tr>' +
        v.cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
        v.rows.map(r => '<tr>' + r.map((c, i) => '<td' + (i ? ' class="mv"' : ' class="mon"') + '>' + c + '</td>').join('') + '</tr>').join('') +
        '</tbody></table></div></div>';

    case 'boss': {
      const b2 = v;
      return '<div class="boss"><div class="bh"><h4>' + esc(b2.name) + '</h4>' +
        '<span class="role">' + esc(b2.role) + '</span>' +
        (b2.badge ? '<span class="badge">' + esc(b2.badge) + '</span>' : '') + '</div>' +
        '<div class="tblwrap"><table><thead><tr><th>Pokémon</th><th>Lv</th><th>Type</th><th>Watch for</th></tr></thead><tbody>' +
        b2.team.map(m => '<tr><td class="mon">' + esc(m.m) + '</td><td class="num">' + esc(m.l) +
          '</td><td>' + tpills(m.t) + '</td><td class="mv">' + (m.note || '') + '</td></tr>').join('') +
        '</tbody></table></div>' +
        '<div class="plan"><span class="lbl">How you win</span><ul>' +
        b2.plan.map(p => '<li>' + p + '</li>').join('') + '</ul>' +
        (b2.reward ? '<p style="margin:12px 0 0;font-size:15px;color:var(--ink2)"><b>Reward:</b> ' + b2.reward + '</p>' : '') +
        '</div></div>';
    }
  }
  return '';
}

/* ---- page render ---- */
function renderAll(){
  const content = document.getElementById('content');
  content.innerHTML = STAGES.map(s => {
    const band = (s.band || []).length
      ? '<dl class="band">' + s.band.map(x => '<div><dt>' + esc(x.k) + '</dt><dd>' + x.v + '</dd></div>').join('') + '</dl>'
      : '';
    return '<section class="stage" id="' + s.id + '"><div class="wrap' + (s.wide ? ' wide' : '') + '">' +
      '<div class="eyebrow"><span class="tag">' + esc(s.tag || chapterOf(s).name) + '</span>' +
      (s.place ? '<span class="where">' + esc(s.place) + '</span>' : '') + '</div>' +
      '<h2>' + esc(s.title) + '</h2>' +
      (s.lede ? '<p class="lede">' + s.lede + '</p>' : '') + band +
      s.body.map(b => renderBlock(b, s.id)).join('') +
      '</div></section>';
  }).join('');

  content.querySelectorAll('[data-widget]').forEach(el => {
    const fn = WIDGETS[el.dataset.widget];
    if (fn) fn(el);
  });

  content.addEventListener('change', e => {
    const cb = e.target.closest('input[type=checkbox][data-k]');
    if (!cb) return;
    if (cb.checked) DONE[cb.dataset.k] = 1; else delete DONE[cb.dataset.k];
    persist();
    const row = cb.closest('.doneRow');
    if (row) row.classList.toggle('isdone', cb.checked);
    updateProgress();
    applyHideDone();
  });

  renderNav();
  updateProgress();
}
function chapterOf(s){ return CHAPTERS.find(c => c.id === s.ch) || {name:''}; }

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = CHAPTERS.map(c => {
    const list = STAGES.filter(s => s.ch === c.id);
    return '<div class="navgroup"><div class="ghead">' + esc(c.name) +
      '<span class="gcount" data-chcount="' + c.id + '"></span></div><ul class="navlist">' +
      list.map(s => '<li><a href="#' + s.id + '" data-nav="' + s.id + '">' +
        '<span class="tick"></span><span>' + esc(s.title) + '</span></a></li>').join('') +
      '</ul></div>';
  }).join('');
  nav.addEventListener('click', e => {
    if (e.target.closest('a') && window.innerWidth <= 960) closeRail();
  });
}

function stageStats(s){
  let total = 0, done = 0;
  document.querySelectorAll('#' + CSS.escape(s.id) + ' input[type=checkbox][data-k]').forEach(cb => {
    total++; if (cb.checked) done++;
  });
  return {total, done};
}
function updateProgress(){
  let gT = 0, gD = 0;
  const perCh = {};
  STAGES.forEach(s => {
    const st = stageStats(s);
    gT += st.total; gD += st.done;
    perCh[s.ch] = perCh[s.ch] || {t:0, d:0, stages:0, full:0};
    perCh[s.ch].t += st.total; perCh[s.ch].d += st.done; perCh[s.ch].stages++;
    if (st.total && st.done === st.total) perCh[s.ch].full++;
    const a = document.querySelector('[data-nav="' + s.id + '"]');
    if (a) a.classList.toggle('done', st.total > 0 && st.done === st.total);
  });
  CHAPTERS.forEach(c => {
    const el = document.querySelector('[data-chcount="' + c.id + '"]');
    const p = perCh[c.id];
    if (el && p) el.textContent = p.full + '/' + p.stages;
  });
  const pct = gT ? Math.round(gD / gT * 100) : 0;
  document.getElementById('globalbar').style.width = pct + '%';
  document.getElementById('globalpct').textContent = pct + '%';
  document.getElementById('globalpct').title = gD + ' of ' + gT + ' steps';
}

/* ---- search ---- */
function runSearch(q){
  q = q.trim().toLowerCase();
  const stages = document.querySelectorAll('.stage');
  let shown = 0;
  stages.forEach(el => {
    const hit = !q || el.textContent.toLowerCase().includes(q);
    el.classList.toggle('hide', !hit);
    if (hit) shown++;
  });
  let msg = document.getElementById('nores');
  if (!msg){
    msg = document.createElement('div');
    msg.id = 'nores'; msg.className = 'wrap nores';
    document.getElementById('content').appendChild(msg);
  }
  msg.style.display = shown ? 'none' : 'block';
  msg.textContent = 'Nothing matches “' + q + '”.';
  document.querySelectorAll('[data-nav]').forEach(a => {
    const s = document.getElementById(a.dataset.nav);
    a.parentElement.style.display = (!s || s.classList.contains('hide')) ? 'none' : '';
  });
}

/* ---- hide done ---- */
let HIDE = false;
function applyHideDone(){
  document.querySelectorAll('.doneRow').forEach(li => {
    li.classList.toggle('hidden', HIDE && li.classList.contains('isdone'));
  });
}

/* ---- theme ---- */
function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem(KEY + ':theme'); } catch (e) {}
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themebtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const next = cur ? (cur === 'dark' ? 'light' : 'dark') : (sysDark ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(KEY + ':theme', next); } catch (e) {}
  });
}

/* ---- rail (mobile) ---- */
function closeRail(){
  document.getElementById('rail').classList.remove('open');
  document.getElementById('scrim').classList.remove('on');
}
/* ---- scrollspy ---- */
function initSpy(){
  const obs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      document.querySelectorAll('[data-nav]').forEach(a => a.classList.remove('on'));
      const a = document.querySelector('[data-nav="' + en.target.id + '"]');
      if (a){ a.classList.add('on'); }
    });
  }, {rootMargin:'-56px 0px -70% 0px', threshold:0});
  document.querySelectorAll('.stage').forEach(s => obs.observe(s));
}

/* ---- Gen IV type chart (no Fairy; Steel resists Ghost & Dark) ---- */
const TYPES = ['Normal','Fire','Water','Electric','Grass','Ice','Fighting','Poison','Ground','Flying','Psychic','Bug','Rock','Ghost','Dragon','Dark','Steel'];
const CHART = {
  Normal:{Rock:.5,Ghost:0,Steel:.5},
  Fire:{Fire:.5,Water:.5,Grass:2,Ice:2,Bug:2,Rock:.5,Dragon:.5,Steel:2},
  Water:{Fire:2,Water:.5,Grass:.5,Ground:2,Rock:2,Dragon:.5},
  Electric:{Water:2,Electric:.5,Grass:.5,Ground:0,Flying:2,Dragon:.5},
  Grass:{Fire:.5,Water:2,Grass:.5,Poison:.5,Ground:2,Flying:.5,Bug:.5,Rock:2,Dragon:.5,Steel:.5},
  Ice:{Fire:.5,Water:.5,Grass:2,Ice:.5,Ground:2,Flying:2,Dragon:2,Steel:.5},
  Fighting:{Normal:2,Ice:2,Poison:.5,Flying:.5,Psychic:.5,Bug:.5,Rock:2,Ghost:0,Dark:2,Steel:2},
  Poison:{Grass:2,Poison:.5,Ground:.5,Rock:.5,Ghost:.5,Steel:0},
  Ground:{Fire:2,Electric:2,Grass:.5,Poison:2,Flying:0,Bug:.5,Rock:2,Steel:2},
  Flying:{Electric:.5,Grass:2,Fighting:2,Bug:2,Rock:.5,Steel:.5},
  Psychic:{Fighting:2,Poison:2,Psychic:.5,Dark:0,Steel:.5},
  Bug:{Fire:.5,Grass:2,Fighting:.5,Poison:.5,Flying:.5,Psychic:2,Ghost:.5,Dark:2,Steel:.5},
  Rock:{Fire:2,Ice:2,Fighting:.5,Ground:.5,Flying:2,Bug:2,Steel:.5},
  Ghost:{Normal:0,Psychic:2,Ghost:2,Dark:.5,Steel:.5},
  Dragon:{Dragon:2,Steel:.5},
  Dark:{Fighting:.5,Psychic:2,Ghost:2,Dark:.5,Steel:.5},
  Steel:{Fire:.5,Water:.5,Electric:.5,Ice:2,Rock:2,Steel:.5}
};
function eff(atk, defTypes){
  return defTypes.reduce((m, d) => m * (CHART[atk] && CHART[atk][d] !== undefined ? CHART[atk][d] : 1), 1);
}

/* ---- boot ---- */
function boot(){
  initTheme();
  renderAll();
  initSpy();
  document.getElementById('search').addEventListener('input', e => runSearch(e.target.value));
  document.getElementById('hidedone').addEventListener('click', e => {
    HIDE = !HIDE;
    e.currentTarget.setAttribute('aria-pressed', String(HIDE));
    applyHideDone();
  });
  document.getElementById('menubtn').addEventListener('click', () => {
    document.getElementById('rail').classList.add('open');
    document.getElementById('scrim').classList.add('on');
  });
  document.getElementById('scrim').addEventListener('click', closeRail);
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT'){
      e.preventDefault(); document.getElementById('search').focus();
    }
    if (e.key === 'Escape') closeRail();
  });
  applyHideDone();
}
</script>

<script>
/* ===================== CORE ===================== */
STAGES.push({
id:"core-rules", ch:"core", tag:"Fundamentals", place:"Generation IV",
title:"The Gen 4 rules that decide your fights",
lede:"Four mechanics separate this game from a modern Pokémon title. Get these wrong and half the guide’s advice will look like nonsense.",
body:[
["h","1 · There is no Fairy type"],
["p","Fairy arrived in Gen 6. In HeartGold, <b>Clefairy is pure Normal</b>, <b>Mr. Mime is pure Psychic</b>, and Dragon has exactly two answers: Ice and Dragon. That is why Clair is the wall she is, and why an Ice move is worth a permanent team slot."],
["h","2 · Steel resists Ghost and Dark"],
["p","In Gen 4, Steel resists <i>eleven</i> types including Ghost and Dark — those resistances were removed in Gen 6. Practically: your Shadow Ball and Crunch are half-power against Steelix, Magneton, Forretress and Skarmory. Bring Fire, Fighting or Ground to those fights instead."],
["h","3 · The physical/special split exists — use it"],
["p","Gen 4 was the split. Damage is decided per move, not per type, so Gyarados can run Waterfall off its huge Attack and Ampharos can run Thunderbolt off Special Attack. Two consequences worth acting on:"],
["ul",[
 "Check which stat a move actually uses before you teach it. A special Fire move on a physical attacker is a wasted slot.",
 "Old “bad” moves are suddenly good — Waterfall, Crunch, Shadow Claw, Iron Tail, Drain Punch and Poison Jab are all physical here."
]],
["h","4 · Badges gate your HMs and your obedience"],
["p","You cannot use an HM in the field until the matching badge is in the case, and traded Pokémon above your badge level will ignore you. This is the actual pacing of the game:"],
["table",{cols:["Badge","Leader","Unlocks in the field","Traded Pokémon obey to"],rows:[
 ["Zephyr","Falkner","Rock Smash","Lv 20"],
 ["Hive","Bugsy","Cut","Lv 30"],
 ["Plain","Whitney","Strength","Lv 40"],
 ["Fog","Morty","Surf","Lv 50"],
 ["Storm","Chuck","Fly","Lv 60"],
 ["Mineral","Jasmine","—","Lv 70"],
 ["Glacier","Pryce","Whirlpool","Lv 80"],
 ["Rising","Clair","Waterfall","Any level"],
 ["16 badges","Prof. Oak","Rock Climb","—"]
]}],
["tip","HM moves are still sticky in Gen 4 — you cannot overwrite them normally. The <b>Move Deleter lives in Blackthorn City</b>, next to the Pokémon Center, and will strip an HM off any Pokémon. The <b>Move Relearner</b> is also in Blackthorn and takes Heart Scales."],
["h","Status is stronger than it looks"],
["ul",[
 "<b>Sleep</b> lasts 1–5 turns in Gen 4 and the counter does not reset on switch — Hypnosis / Sing / Spore win fights outright.",
 "<b>Paralysis</b> cuts Speed by 75% (not 50% as in Gen 7+). Thunder Wave neuters a sweeper completely.",
 "<b>Burn</b> halves physical Attack. Will-O-Wisp is a legitimate answer to Machamp and to Bruno.",
 "Confusion damage is 50% self-hit chance. Swagger + Psych Up strategies are real here, but so is losing to Whitney’s Attract."
]],
["h","Two coin-flip mechanics that will ruin a run"],
["ul",[
 "<b>Focus Band / Quick Claw / Attract</b> — every one of these appears on a Gym Leader Pokémon at some point. Save state before a wall fight if you value your time.",
 "<b>Critical hits are 1/16</b> and ignore your defensive boosts. That is how Whitney’s Miltank ends things."
]]
]});

STAGES.push({
id:"core-team", ch:"core", tag:"Fundamentals", place:"Team planning",
title:"Picking a starter and building a six that clears Johto",
lede:"Johto has a genuinely thin early roster — Fire and Electric barely exist before the fourth badge — so team-building here is mostly about covering the region’s known potholes.",
body:[
["h","The starter decision"],
["table",{cols:["Starter","Line","The case for it","The cost"],rows:[
 ["<b>Cyndaquil</b>","Quilava → Typhlosion","The efficiency pick. Fire is nearly absent from Johto’s wild roster, so this is your only reliable answer to Bugsy, Jasmine and half the Elite Four. Big Special Attack, gets Flamethrower early enough to matter.","Bad matchups against Chuck, Clair and the entire Kanto Water block. Needs a partner that handles Rock and Water."],
 ["<b>Totodile</b>","Croconaw → Feraligatr","The balanced pick. Physical Water with Ice Fang and Crunch covers Clair, Pryce’s Piloswine and Lance’s dragons. Doubles as your Surf and Waterfall carrier, which frees a team slot.","Slow to come online, and it does nothing special against Whitney, Morty or Bugsy."],
 ["<b>Chikorita</b>","Bayleef → Meganium","The challenge run. Weak to Falkner, Bugsy, Morty, Jasmine and Pryce — five of eight Johto gyms — and its offensive typing is resisted everywhere.","Only take this if you want the run to be hard on purpose. If you do, plan on a second attacker much earlier."]
]}],
["team","<b>If you want one recommendation:</b> take <b>Cyndaquil</b>. Johto’s wild Pokémon give you Water, Flying, Ground and Electric for free, but they will not hand you a good Fire type for another twenty hours. Totodile is the fine second choice if you would rather have Surf on a real attacker."],
["h","A six that works, all catchable in Johto without trading"],
["catch",[
 {n:"Typhlosion", t:["Fire"], where:"Starter — New Bark Town", why:"Your special sweeper all game. Flamethrower via the Goldenrod Game Corner is the single biggest power spike available before badge five."},
 {n:"Gyarados", t:["Water","Flying"], where:"Red Gyarados, Lake of Rage — Lv 30, free, guaranteed", why:"Enormous Attack, arrives fully evolved right when the level curve gets steep, and carries Surf, Waterfall, Whirlpool and Strength. Intimidate blunts every physical gym leader."},
 {n:"Ampharos", t:["Electric"], where:"Mareep — Route 32, then Route 42/43", why:"Johto's only convenient Electric line. Answers the Water and Flying that Typhlosion cannot, and Thunder Wave turns hard fights into manageable ones."},
 {n:"Crobat", t:["Poison","Flying"], where:"Zubat — Dark Cave / Union Cave (evolves at high friendship)", why:"Absurdly fast, learns Fly, and Flying beats Bugsy, Chuck, Bruno and half of Karen's team. Friendship evolution pairs nicely with the Goldenrod haircut and Daisy's massages."},
 {n:"Heracross", t:["Bug","Fighting"], where:"Headbutt trees — Azalea Town, Routes 42/44/45/46", why:"The answer to Whitney, to Kanto's Normal walls, and to Karen's Dark types. Requires Headbutt from the Ilex Forest tutor, so it slots in right after badge two."},
 {n:"Quagsire", t:["Water","Ground"], where:"Wooper — Route 32 (night) and Union Cave", why:"Immune to Electric, resists Rock and Fire, and covers the Ground weakness on your Fire and Electric slots. Unspectacular but it plugs the exact holes this team has."}
]],
["h","Strong alternatives, and what they cost you"],
["ul",[
 "<b>Lapras</b> (Union Cave B2F, Fridays only, from badge four) — a better bulk option than Quagsire and the best HM carrier in the game. Costs you a week of real time if you miss the Friday window.",
 "<b>Espeon / Umbreon</b> (Eevee gift from Bill in Goldenrod) — Espeon is a better special attacker than almost anything else available at that point; Umbreon is the sturdiest thing in Johto. Evolve by levelling up with high friendship during the day (Espeon) or at night (Umbreon).",
 "<b>Dragonite</b> (Dratini gift in Dragon’s Den after Clair, or fishing there) — arrives at Lv 15 with ExtremeSpeed if you answer the elder’s questions kindly. Evolves at 55, so it is really an Elite Four and Kanto project.",
 "<b>Tyranitar</b> (Larvitar, Mt. Silver) — post-game only. Save it for the Elite Four rematch and the Frontier.",
 "<b>Steelix / Scizor / Gengar / Machamp / Alakazam</b> — all excellent, all need a trade. If you set up the two-instance trick in the setup chapter, they are on the table.",
 "<b>Togekiss</b> is <i>not</i> available: the Shiny Stone is post-game, and in Gen 4 Togekiss is Normal/Flying, not Fairy."
]],
["h","The HM problem, solved once"],
["p","Eight field moves, six team slots. The trick is to let real attackers carry the water HMs and to keep exactly one disposable carrier for the rest."],
["table",{cols:["HM","Where you get it","Who should carry it"],rows:[
 ["HM01 Cut","Ilex Forest — from the charcoal maker after you return his Farfetch’d","The mule (Furret is the classic — Sentret is on Routes 29–31)"],
 ["HM02 Fly","Cianwood City — Chuck’s wife, after the gym","Crobat, or a Noctowl/Pidgeot mule"],
 ["HM03 Surf","Ecruteak Dance Theatre — after the Kimono Girls’ Rocket","Gyarados or Lapras — Surf is a genuinely good attack"],
 ["HM04 Strength","Route 42 — Hiker outside Mt. Mortar","Gyarados, Quagsire or the mule"],
 ["HM05 Whirlpool","Rocket HQ — Lance gives it after the generator","Gyarados or Lapras"],
 ["HM06 Rock Smash","Route 36 — man east of the Sudowoodo tree","The mule (and it breaks rocks hiding Heart Scales)"],
 ["HM07 Waterfall","Ice Path 1F","Gyarados or Lapras — also a strong physical STAB"],
 ["HM08 Rock Climb","Pallet Town — Prof. Oak, after all 16 badges","The mule, or Donphan"]
]}],
["tip","Build the mule early. A <b>Furret</b> caught on Route 29 covers Cut, Strength, Rock Smash, Rock Climb and Surf between them, which means your real team only ever needs Fly plus the two water HMs."],
["mount","planner"]
]});

STAGES.push({
id:"core-econ", ch:"core", tag:"Fundamentals", place:"Money, XP, items",
title:"The economy: where levels, money and good moves actually come from",
lede:"HeartGold gives you no Exp. Share until roughly the seventh badge. Knowing the real sources of progress is what keeps this from becoming a grind.",
body:[
["h","Experience"],
["ul",[
 "<b>There is no early Exp. Share.</b> You get it from Mr. Pokémon on Route 30 in exchange for the <b>Red Scale</b> the Red Gyarados drops at Lake of Rage — that is badge seven territory. Plan on levelling your team by using it, not by parking a low-level mon.",
 "<b>Pokégear rematches are the main XP faucet.</b> Accept every trainer’s number, then answer their calls: they tell you when they want a rematch, and the same trainer levels up with you. The Route 39/38 and Route 42 trainers are the most convenient loops.",
 "<b>The Lucky Egg</b> is held by ~5% of wild <b>Chansey</b> on Kanto Routes 13/14/15 and in the Safari Zone Meadow. Bring a Thief user or a lot of patience. It is worth the detour before you grind for the Elite Four rematch.",
 "<b>Trainer House</b> in Viridian City can be battled once a day — good, fast XP late.",
 "Rare Candies show up in the Goldenrod lottery and the Pokéathlon shop."
]],
["h","Money"],
["ul",[
 "<b>Amulet Coin</b> — Goldenrod Department Store basement. Doubles prize money when the holder participates. Get it the first time you are in Goldenrod and never take it off.",
 "<b>Nuggets</b> — Team Rocket grunts drop them constantly through Slowpoke Well, the Rocket HQ and the Radio Tower. Sell them.",
 "<b>Rematch calls</b> against Kanto trainers pay far better than Johto ones. Once the Magnet Train runs, a Kanto lap is the fastest money in the game."
]],
["h","Voltorb Flip is the biggest power spike in the game"],
["p","In every non-Japanese release, the Game Corner slots were replaced with <b>Voltorb Flip</b> — a Minesweeper/Picross hybrid that is pure logic, not luck, once you learn it. It is also where the game hides its best mid-game moves:"],
["table",{cols:["Prize","Corner","Cost","Why it matters"],rows:[
 ["TM13 Ice Beam","Goldenrod","10,000 coins","Your answer to Clair, Lance and every Dragon and Ground type for the rest of the game"],
 ["TM24 Thunderbolt","Goldenrod","10,000 coins","Answers Gyarados, Lance’s Gyarados, and the entire Kanto Water block"],
 ["TM35 Flamethrower","Goldenrod","10,000 coins","Turns Typhlosion on properly; also the fix for Jasmine and Erika"],
 ["TM75 Swords Dance","Goldenrod","4,000 coins","Makes Heracross and Gyarados win fights they should lose"],
 ["Dratini","Goldenrod","2,100 coins","A second Dragonite project, well before Dragon’s Den"],
 ["TM68 Giga Impact","Celadon","15,000 coins","Late-game nuke"],
 ["TM29 Psychic","Celadon","10,000 coins","Cleans up Koga and the Fighting Dojo"]
]}],
["tip","Learn Voltorb Flip properly — the row/column numbers tell you exactly which tiles are safe, and a good player clears level 7 repeatedly. An hour of it around badge four buys Ice Beam <i>and</i> Flamethrower, which is worth more than ten levels."],
["h","Held items worth chasing early"],
["loot",[
 {k:"Item", n:"Amulet Coin", where:"Goldenrod Dept. Store basement", why:"Double prize money."},
 {k:"Item", n:"King’s Rock", where:"Slowpoke Well", why:"Flinch chance, and the Politoed / Slowking trade evolution item."},
 {k:"Item", n:"Leftovers", where:"Held by the Snorlax on Kanto Route 11", why:"The best passive item in the game. Catch the Snorlax, do not just KO it."},
 {k:"Item", n:"Macho Brace", where:"Held by the traded Machop “Muscle”, Goldenrod Dept. Store 4F", why:"EV training, if you go that far."},
 {k:"Item", n:"Metal Coat", where:"Held by the traded Magneton in the Kanto Power Plant", why:"Steelix and Scizor."},
 {k:"Item", n:"Exp. Share", where:"Mr. Pokémon, Route 30 — trade the Red Scale", why:"Bring an underlevelled sixth member up to the Elite Four."},
 {k:"Item", n:"Heart Scales", where:"Rock Smash rocks (Violet, Cianwood, Dark Cave), Route 32 hidden, Pokéathlon shop", why:"Currency for the Blackthorn Move Relearner — how you get good moves onto old Pokémon."}
]],
["do",[
 "Pick your starter and write down your intended six.",
 "Plan which Pokémon carries which HM before you are forced to improvise.",
 "Set a coin target for Voltorb Flip: 24,000 coins buys Ice Beam, Thunderbolt and Flamethrower."
]]

title:"Cut, Headbutt, and the biggest city in Johto",
lede:"Ilex Forest gives you two of the most useful field moves in the game. Goldenrod gives you everything else.",
band:[{k:"Party level",v:"17 → 20"},{k:"Badges",v:"2"},{k:"Unlocks",v:"Cut · Headbutt"}],
body:[
["h","Ilex Forest"],
["p","The charcoal maker’s <b>Farfetch’d</b> has run off. Herd it by approaching from the right side — it moves away from you — until it is boxed in. He rewards you with <b>HM01 Cut</b>."],
["p","In the same forest, a man teaches <b>Headbutt</b> free of charge, as many times as you like. This is not optional: Headbutt is how you get Heracross, Pineco, Aipom, Exeggcute, Spinarak/Ledyba and a fistful of other dex entries out of trees."],
["warn","The <b>Ilex Forest shrine</b> is where the event Celebi episode fires if you ever obtain the event Celebi. Nothing happens now — just know that this clearing is why people care about that distribution."],
["h","Route 34"],
["loot",[
 {k:"TM63", n:"Embargo", where:"Route 34"},
 {k:"Key", n:"Kenya (Spearow)", where:"The guard in the gate north of Route 34 asks you to carry it — deliver it to Webster on Route 31", why:"Completing the errand chain gets you TM44 Rest."},
 {k:"Item", n:"Day-Care", where:"Route 34 — the couple raise and breed Pokémon", why:"Egg moves, friendship building, and the fastest way to hatch a better-natured starter if you care."}
]],
["catch",[
 {n:"Abra", t:["Psychic"], where:"Routes 33–35 (rare, Teleports immediately)", why:"Kadabra is a monster for the next four badges, and Alakazam is one trade away. Throw a ball on turn one or use a Level Ball."},
 {n:"Drowzee", t:["Psychic"], where:"Route 34", why:"Hypnosis makes catching everything else easier, and there is a Machop trade in Goldenrod that wants one."},
 {n:"Ditto", t:["Normal"], where:"Route 34", why:"Breeding partner for everything. Grab it now, thank yourself later."}
]],
["h","Goldenrod City — the checklist"],
["do",[
 {t:"Department Store basement: <b>Amulet Coin</b>.", sub:"Doubles prize money. Put it on a team member and forget about it."},
 {t:"Bike Shop: take the <b>Bicycle</b>.", sub:"Free in this version. It also unlocks the Cycling Road much later."},
 {t:"Radio Tower 2F: answer the quiz for the <b>Radio Card</b>.", sub:"The radio drives swarms, the Buena password bonus, and later the Pokéflute."},
 {t:"Underground: buy from the day-specific shops and find <b>TM82 Sleep Talk</b> in the warehouse."},
 {t:"Underground: the <b>haircut brothers</b> raise friendship — once a day, each.", sub:"This is the fastest Crobat and Espeon/Umbreon accelerator in the game."},
 {t:"Department Store 4F: trade a Drowzee for <b>Machop “Muscle”</b>.", sub:"It holds a Macho Brace."},
 {t:"Name Rater, Move… and the Game Corner.", sub:"See below — the Game Corner is a bigger deal than it looks."},
 {t:"Come back for <b>Eevee</b> from Bill later.", sub:"Bill is in Ecruteak first; after you meet him there he returns to his Goldenrod house and gives you an Eevee."}
]],
["tip","Play <b>Voltorb Flip</b> in the Game Corner now, not later. 10,000 coins each buys <b>Ice Beam</b>, <b>Thunderbolt</b> and <b>Flamethrower</b> — three moves that carry your team from here to the Elite Four. It is a logic puzzle, not a slot machine: the numbers on each row and column tell you exactly how many bomb tiles are there."],
["h","Radio stations worth knowing"],
["ul",[
 "<b>Oak’s Pokémon Talk</b> — announces the day’s <b>swarm</b>, which is how several otherwise-rare Pokémon become catchable.",
 "<b>Buena’s Password</b> (night) — a nightly password at the Goldenrod Radio Tower earns points for prizes.",
 "<b>Pokégear Channels</b> unlock as you go; the Hoenn and Sinnoh Sound channels appear after the National Dex and are needed for some Kanto encounters."
]]
]});

STAGES.push({
id:"j06", ch:"johto", tag:"Stage 06", place:"Goldenrod Gym",
title:"Plain Badge — Whitney, and the Miltank problem",
lede:"The famous difficulty spike. It is not a hard fight once you understand that Rollout, Attract and Milk Drink are three separate problems that need three separate answers.",
band:[{k:"Party level",v:"18 → 21"},{k:"Badge",v:"Plain"},{k:"Unlocks",v:"Strength"}],
body:[
["boss",{
name:"Whitney", role:"Goldenrod City Gym · Normal", badge:"Plain Badge",
team:[
 {m:"Clefairy", l:17, t:["Normal"], note:"Pure <b>Normal</b> in Gen 4 — there is no Fairy type here. Doubleslap, Encore, Metronome. Encore can lock you into a status move."},
 {m:"Miltank", l:19, t:["Normal"], note:"Rollout, Attract, Stomp, Milk Drink. Holds a Lum Berry in some encounters. This is the wall."}
],
plan:[
 "<b>Rollout</b> doubles in power every consecutive hit and runs up to five turns. It is a <b>Rock</b> move: Geodude, Onix and Quagsire (Ground) resist or shrug it off. Rock Smashing a Geodude into your party for this one fight is a completely legitimate play.",
 "<b>Attract</b> only works on the opposite gender. Miltank is always female — so lead with a <b>female or genderless</b> Pokémon and the move does nothing. Your starter is most likely male; this is the single biggest tip for this fight.",
 "<b>Milk Drink</b> heals half its HP. You cannot win a damage race — you need burst. Fighting moves are 2×; Heracross with Brick Break, a Machop from the Goldenrod trade, or Rock Smash off anything will out-pace the healing.",
 "Failing all that: <b>paralyse it</b>. Thunder Wave from a Mareep cuts its Speed by 75% and gives you free turns.",
 "Kill the Clefairy quickly — Encore locking you into Growl or Leer while Rollout ramps is how runs die here."
],
reward:"TM45 Attract, the Plain Badge, and Strength."
}],
["h","Immediately after"],
["do",[
 "Beat Whitney.",
 {t:"Take the <b>SquirtBottle</b> from the flower shop next to the gym.", sub:"This is what wakes the Sudowoodo blocking Route 36. The game will not let you progress north without it."},
 "Check the Pokéathlon Dome — it opens after this badge.",
 "Buy your Voltorb Flip TMs if you have the coins."
]],
["team","With Strength in hand, your mule can now push boulders — Union Cave B2F, Slowpoke Well’s lower level and several Ruins of Alph chambers all open up. If you are collecting everything, a short backtrack here is cheaper than a long one later."]
]});

STAGES.push({
id:"j07", ch:"johto", tag:"Stage 07", place:"Routes 35–37 · National Park · Pokéathlon",
title:"National Park, the Bug Contest, and a tree that fights back",
lede:"The most content-dense stretch in Johto. Two of the things here are on a weekly timer, so check the day before you plan your route.",
band:[{k:"Party level",v:"20 → 23"},{k:"Badges",v:"3"},{k:"Timed",v:"Tue / Thu / Sat"}],

["h","The Bug-Catching Contest — Tuesday, Thursday, Saturday"],

["do",[
 {t:"Enter the Bug-Catching Contest and win at least once.", sub:"Weaken with a false-swipe-style move; the game scores you on species rarity and the Pokémon’s condition."},
 {t:"Catch a Scyther and/or Pinsir here.", sub:"Scyther is one Metal Coat trade away from Scizor, which is a top-tier team member."},
 {t:"Collect the Sun Stone prize.", sub:"Sunkern → Sunflora and Gloom → Bellossom both need it, and it is scarce."}
]],
["h","National Park & Route 35"],
["loot",[
 {k:"TM28", n:"Dig", where:"National Park"},
 {k:"TM66", n:"Payback", where:"Route 35"},
 {k:"Item", n:"Quick Claw / berries", where:"National Park, scattered"}
]],
["catch",[
 {n:"Scyther / Pinsir", t:["Bug"], where:"National Park — Bug Contest days only", why:"Both are excellent, both are painful to find anywhere else."},
 {n:"Yanma", t:["Bug","Flying"], where:"Route 35", why:"Yanmega is a genuinely strong evolution, though it needs the AncientPower level-up trick."},
 {n:"Growlithe", t:["Fire"], where:"Routes 36–37 (HeartGold exclusive)", why:"A second Fire type, and version-exclusive — catch two if you plan to trade for a Vulpix."},
 {n:"Nidoran ♂/♀", t:["Poison"], where:"Route 35", why:"Two full evolution lines for the dex out of one route."}
]],
["h","Sudowoodo"],
["p","The “tree” on Route 36 is a level 20 <b>Sudowoodo</b> and it blocks the road to Ecruteak. Use the SquirtBottle from the Goldenrod flower shop and it attacks you."],
["warn","This is the <b>only Sudowoodo in the game</b>. If you knock it out, it is gone. Save first, weaken carefully, and throw balls — a Level Ball works well here since you are probably around its level."],
["h","Routes 36–37"],
["loot",[
 {k:"HM06", n:"Rock Smash", where:"Route 36 — from the man just east of where Sudowoodo stood"},
 {k:"Item", n:"Apricorns", where:"Routes 36–37 — blue, red and green trees"}
]],
["ul",[
 "<b>Thursday:</b> Arthur is on Route 36 and gives a <b>Hard Stone</b>.",
 "<b>Sunday:</b> Sunny is on Route 37 with a <b>Magnet</b>.",
 "The northern <b>Ruins of Alph</b> entrance is here — another chamber for the Unown collection."
]],
["h","The Pokéathlon"],
["p","West of the National Park, open from the Plain Badge onwards. Ten touch-driven minigames across five courses. Two reasons to care:"],
["ul",[
 "The <b>Athlete Shop</b> stocks evolution stones, Apricorns, Heart Scales, held items and the occasional Rare Candy — rotating daily, twelve items a day once you have the National Dex.",
 "It is the only source of several evolution items without a lot of grinding, and it is genuinely fun with the trackpad configured as a stylus."
]],
["do",[
 "Wake and catch Sudowoodo.",
 "Take HM06 Rock Smash from the Route 36 man.",
 "Run at least one Pokéathlon course and check the Athlete Shop’s stock.",
 "Grab TM28 Dig and TM66 Payback.",
 "Headbutt the trees on Routes 35–37 while you pass through."
]]

STAGES.push({
id:"j08", ch:"johto", tag:"Stage 08", place:"Ecruteak City · Burned Tower",
title:"Fog Badge — Morty, Surf, and three legendary beasts",
lede:"Ecruteak is the hinge of the whole game: you leave with Surf, with the roaming beasts released, and with the Ghost gym behind you.",
band:[{k:"Party level",v:"23 → 27"},{k:"Badge",v:"Fog"},{k:"Unlocks",v:"Surf"}],
body:[
["h","Burned Tower"],
["p","Your rival fights you on the ground floor. Drop through to the basement and the three statues wake: <b>Raikou</b>, <b>Entei</b> and <b>Suicune</b> burst out and scatter. Raikou and Entei begin <b>roaming Johto</b> at level 40 from this moment; Suicune runs a scripted route you will meet several more times."],
["warn","Roamers flee on turn one. Before you seriously chase Raikou and Entei, you want: a Pokémon with <b>Mean Look</b> or <b>Block</b> (Crobat learns Mean Look; Wobbuffet works), a way to inflict <b>sleep or paralysis</b>, and a stack of Ultra Balls. Trying to catch them with the tools you have at badge four is a recipe for burning them out of the encounter table for the rest of the run. Note their location on the Pokégear map and come back."],
["h","The Dance Theatre → Surf"],
["p","A Team Rocket grunt is harassing the Kimono Girls in the Dance Theatre. Deal with him and the old man there gives you <b>HM03 Surf</b> — the single largest map unlock in the game."],
["tip","Put Surf on Gyarados or Lapras rather than the mule. It is a 95-power STAB move for either of them and you will use it in real fights for the next forty hours."],
["boss",{
name:"Morty", role:"Ecruteak City Gym · Ghost", badge:"Fog Badge",
team:[
 {m:"Gastly", l:21, t:["Ghost","Poison"], note:"Lick, Spite, Mean Look, Curse."},
 {m:"Haunter", l:21, t:["Ghost","Poison"], note:"Hypnosis, Mean Look, Shadow Ball."},
 {m:"Haunter", l:23, t:["Ghost","Poison"], note:"Same kit, more damage."},
 {m:"Gengar", l:25, t:["Ghost","Poison"], note:"<b>Levitate</b> — Ground moves miss entirely. Hypnosis + Dream Eater + Nightmare is a genuine lock if it lands."}
],
plan:[
 "The whole gym is Ghost/<b>Poison</b>, so <b>Psychic</b> moves are 2× on everything — a Kadabra or the Togepi you hatched (Extrasensory) walks through this fight.",
 "Dark and Ghost also work, but remember Gen 4 Steel resists them — irrelevant here, relevant next gym.",
 "<b>Hypnosis is the loss condition.</b> Carry two Awakenings or a Chesto Berry, or lead with something holding a Persim/Lum. Sleep in Gen 4 does not tick down while you switch.",
 "Curse costs them half their HP to lay a residual on you — if a Gastly curses, switch the victim out; the damage continues but you can heal between fights.",
 "Gengar’s Levitate makes Earthquake and Dig dead weight. Do not build the fight around them."
],
reward:"TM30 Shadow Ball, the Fog Badge, and Surf."
}],
["h","Do not leave Ecruteak without"],
["do",[
 "Beating your rival in the Burned Tower.",
 "Releasing the beasts (unavoidable — but read the roamer warning first).",
 "HM03 Surf from the Dance Theatre.",
 "Beating Morty.",
 {t:"Meeting <b>Bill</b> in Ecruteak.", sub:"He then goes home to Goldenrod, where he hands you an Eevee. Detour back for it — Espeon and Umbreon are both excellent and this is the only Eevee in the game outside the Pokéwalker."},
 {t:"Noting the <b>Bell Tower</b>.", sub:"Locked until the very end of the Johto story, when the Kimono Girls open it for Ho-Oh."},
 {t:"Surfing back to everything you skipped.", sub:"Ruins of Alph chambers, Union Cave B2F, Slowpoke Well lower level, Route 32’s plateau."}
]]

 {k:"TM83", n:"Natural Gift", where:"Moomoo Farm — after healing the Miltank"},

STAGES.push({
id:"j10", ch:"johto", tag:"Stage 10", place:"Routes 40–41 · Cianwood City",
title:"Storm Badge — Chuck, and Fly at last",

body:[
["h","The crossing"],
["p","Surf from Olivine down Route 40 into Route 41. The whirlpools dotted around are the <b>Whirl Islands</b> — you cannot enter properly until you have Whirlpool (badge seven), and Lugia is not there until the post-game, so do not waste time circling them now. Route 41 is also the best <b>Chinchou</b> and <b>Mantine</b> water in the game."],
["catch",[
 {n:"Chinchou", t:["Water","Electric"], where:"Route 41 — Good Rod / surfing", why:"Lanturn is a great defensive Water/Electric and covers two team weaknesses in one slot."},
 {n:"Tentacool", t:["Water","Poison"], where:"Routes 40–41", why:"Dex line, and a fine cheap Surf carrier if you have nothing better."},
 {n:"Mantine", t:["Water","Flying"], where:"Route 41 (HeartGold exclusive)", why:"Version exclusive — trade bait for the SoulSilver side later."},
 {n:"Shuckle", t:["Bug","Rock"], where:"Cianwood — gift from the man in the south-west house after the gym", why:"Useless in a fight, but it is a free dex entry and a Berry-juice machine."}
]],
["h","Cianwood City"],
["do",[
 {t:"Take the <b>SecretPotion</b> from the pharmacy.", sub:"This is the item Jasmine needs. Do not leave without it."},
 {t:"Rock Smash the boulders on the beach.", sub:"Cianwood is one of the reliable Heart Scale spots."},
 {t:"Accept the <b>Shuckle</b> from the man in the south-west house.", sub:"He refuses to take it back afterwards."},
 {t:"Talk to <b>Eusine</b>.", sub:"He is chasing Suicune and shows up repeatedly from here on. The Suicune chain resolves in Kanto."}
]],
["boss",{
name:"Chuck", role:"Cianwood City Gym · Fighting", badge:"Storm Badge",
team:[
 {m:"Primeape", l:29, t:["Fighting"], note:"Karate Chop, Rock Slide, Focus Energy, Fury Swipes. Focus Energy plus Karate Chop means frequent crits."},
 {m:"Poliwrath", l:31, t:["Water","Fighting"], note:"Surf, Hypnosis, <b>Mind Reader + Dynamic Punch</b> — Mind Reader makes the next move hit for certain, and Dynamic Punch confuses. This combo can single-handedly lose the fight."}

plan:[
 "<b>Flying</b> and <b>Psychic</b> are both 2× on Primeape and Psychic is 2× on Poliwrath. A Crobat or a Kadabra ends this quickly.",

STAGES.push({
id:"j11", ch:"johto", tag:"Stage 11", place:"Routes 47–48 · Safari Zone · Olivine Gym",
title:"Mineral Badge — the Safari Zone detour and Jasmine",
lede:"The Safari Zone is optional for the story and mandatory for the Pokédex. Do the opening work now so its slow, day-counted unlocks are ticking in the background for the rest of the run.",
band:[{k:"Party level",v:"30 → 34"},{k:"Badge",v:"Mineral"},{k:"Long game",v:"Safari Zone"}],
body:[
["h","Routes 47 and 48"],
["p","West and north out of Cianwood through the Cliff Edge Gate. <b>Cliff Cave</b> and the cliffs here need Rock Climb for their upper reaches, so expect a return trip. Route 47 also holds the <b>Embedded Tower</b> — sealed now, and the site of the Kyogre/Groudon/Rayquaza encounters in the deep post-game."],
["h","The Safari Zone, and why to start it now"],
["p","Baoba’s Safari Zone runs on a system unique to these games: you place <b>terrain blocks</b> in each area, and the encounter table changes based on which blocks are down <i>and how many in-game days have passed</i> since you placed them. Some Pokémon need ~10 days of a particular block arrangement before they appear at all."],
["warn","This is the single slowest completion task in the game, and it runs on the real-world calendar. Place your first block set now and it costs you nothing; leave it until after the Elite Four and you will be sitting on your hands for weeks. Add a recurring reminder to rotate the blocks."],
["do",[
 "Complete Baoba’s introductory challenge to open the Safari Zone properly.",
 {t:"Place your first terrain blocks in each area.", sub:"Peak, Forest, Swamp, Wasteland, Savannah, Marshland — start with whatever pushes toward Pokémon you do not have."},
 "Set a reminder to come back and rotate blocks every week or so.",
 "Note Cliff Cave and the Route 47 cliffs for a Rock Climb return."
]],
["h","Back to Olivine"],
["p","Fly to Olivine, take the SecretPotion up the lighthouse, and Amphy recovers. Jasmine returns to her gym."],
["boss",{
name:"Jasmine", role:"Olivine City Gym · Steel", badge:"Mineral Badge",
team:[
 {m:"Magnemite", l:30, t:["Electric","Steel"], note:"Thunderbolt, Supersonic. <b>4× weak to Ground.</b>"},
 {m:"Magnemite", l:30, t:["Electric","Steel"], note:"Same."},
 {m:"Steelix", l:35, t:["Steel","Ground"], note:"Iron Tail, Rock Throw, Screech, Sunny Day. Sturdy means it survives a would-be one-shot. Screech halves your Defence — switch out rather than eat a boosted Iron Tail."}
],
plan:[
 "<b>Ground</b> is 4× on both Magnemite and neutral into Steelix. A Quagsire or a Dig user clears the first half of the gym by itself.",
 "Steelix is 2× to <b>Fire</b>, <b>Water</b> and <b>Fighting</b>. Typhlosion’s Flamethrower, Gyarados’ Surf or Heracross all handle it. Do not bring Shadow Ball or Crunch — Gen 4 Steel resists both.",
 "Watch the Magnemite’s Thunderbolt if you lead with Gyarados; it is 4× on a Water/Flying body.",
 "Screech stacks. Two of them and Iron Tail one-shots most of your team — treat it as a signal to rotate."
],
reward:"TM23 Iron Tail and the Mineral Badge."
}],
["tip","Once you have beaten her, you can come back post-game and trade <b>any Pokémon</b> for Jasmine’s <b>Steelix “Rusty”</b> after rematching her at the Saffron Fighting Dojo. It is the least demanding good trade in the game."]
]});

STAGES.push({

<script>
/* ===================== WIDGETS ===================== */

/* — TM / HM index — */
WIDGETS.tmindex = function(el){
  const rows = MACHINES.map(m => {
    const id = 'mach-' + m[0];
    const on = !!DONE[id];
    return '<tr class="doneRow' + (on ? ' isdone' : '') + '" data-search="' + esc((m[0] + ' ' + m[1] + ' ' + m[2] + ' ' + m[3]).toLowerCase()) + '">' +
      '<td><input class="have" type="checkbox" data-k="' + id + '"' + (on ? ' checked' : '') + ' aria-label="Have ' + esc(m[0]) + '"></td>' +
      '<td class="num">' + esc(m[0]) + '</td>' +
      '<td class="mon">' + esc(m[1]) + '</td>' +
      '<td>' + tpill(m[2]) + '</td>' +
      '<td class="mv">' + esc(m[3]) + '</td></tr>';
  }).join('');
  el.innerHTML =
    '<div class="reftable"><div class="rh">' +
      '<input id="tmfilter" type="search" placeholder="Filter by number, move, type or place…" autocomplete="off">' +
      '<span class="pct mono" id="tmcount"></span>' +
    '</div><div class="tblwrap"><table><thead><tr><th>Have</th><th>#</th><th>Move</th><th>Type</th><th>Where it comes from</th></tr></thead>' +
    '<tbody id="tmbody">' + rows + '</tbody></table></div></div>';

  const body = el.querySelector('#tmbody');
  const count = el.querySelector('#tmcount');
  function tally(){
    const have = MACHINES.filter(m => DONE['mach-' + m[0]]).length;
    count.textContent = have + ' / ' + MACHINES.length;
  }
  tally();
  body.addEventListener('change', tally);
  el.querySelector('#tmfilter').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    body.querySelectorAll('tr').forEach(tr => {
      tr.classList.toggle('rowhide', !!q && !tr.dataset.search.includes(q));
    });
  });
};

/* — Weekly day board — */
WIDGETS.days = function(el){
  el.innerHTML = '<div class="dayboard" id="dayboard"></div>';
  drawDays();
};
function drawDays(){
  const board = document.getElementById('dayboard');
  if (!board) return;
  const sel = document.getElementById('daypick');
  const chosen = sel && sel.value !== 'today' ? parseInt(sel.value, 10) : new Date().getDay();
  board.innerHTML = DAYS.map((d, i) =>
    '<div class="daycard' + (i === chosen ? ' today' : '') + '"><h4>' + esc(d[0]) +
    (i === chosen ? '<span class="mk">selected</span>' : '') + '</h4><ul>' +
    d[1].map(x => '<li>' + x + '</li>').join('') + '</ul></div>').join('');
}

/* — Gen IV type calculator — */
WIDGETS.types = function(el){
  const opts = TYPES.map(t => '<option value="' + t + '">' + t + '</option>').join('');
  el.innerHTML =
    '<div class="planner"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">' +
      '<label style="font-family:\'DM Mono\',monospace;font-size:11px;color:var(--ink3)">Attacking move<br><select class="daypick" id="atkT">' + opts + '</select></label>' +
      '<label style="font-family:\'DM Mono\',monospace;font-size:11px;color:var(--ink3)">Defender type 1<br><select class="daypick" id="defA">' + opts + '</select></label>' +
      '<label style="font-family:\'DM Mono\',monospace;font-size:11px;color:var(--ink3)">Defender type 2<br><select class="daypick" id="defB"><option value="">— none —</option>' + opts + '</select></label>' +
    '</div><div id="typeout" style="margin-top:14px"></div></div>';
  const out = el.querySelector('#typeout');
  function calc(){
    const a = el.querySelector('#atkT').value;
    const d1 = el.querySelector('#defA').value;
    const d2 = el.querySelector('#defB').value;
    const defs = d2 ? [d1, d2] : [d1];
    const m = eff(a, defs);
    const label = m === 0 ? 'No effect' : m >= 4 ? 'Devastating' : m >= 2 ? 'Super effective' : m <= 0.25 ? 'Almost nothing' : m < 1 ? 'Resisted' : 'Neutral';
    const cls = m >= 2 ? 'ok' : (m < 1 ? 'bad' : '');
    out.innerHTML = '<div class="cvcell ' + cls + '" style="max-width:320px"><div class="cvt">' +
      esc(a) + ' → ' + esc(defs.join(' / ')) + '</div><div class="cvv" style="font-size:20px">×' + m + ' — ' + label + '</div></div>';
  }
  el.querySelectorAll('select').forEach(s => s.addEventListener('change', calc));
  calc();
};

/* — Team planner — */
let TEAM = [];
try { TEAM = JSON.parse(localStorage.getItem(KEY + ':team') || '[]') || []; } catch (e) { TEAM = []; }
WIDGETS.planner = function(el){
  el.innerHTML =
    '<div class="planner"><h3 style="margin-top:0">Team planner</h3>' +
    '<p style="font-size:15px;color:var(--ink2);margin:0 0 4px;max-width:66ch">Pick up to six. The panel below counts how many of your team each attacking type hurts, and flags the types nothing on your team hits hard.</p>' +
    '<div class="slots" id="slots"></div>' +
    '<div class="pool" id="pool"></div>' +
    '<div id="coverage"></div></div>';
  drawPlanner(el);
  el.addEventListener('click', e => {
    const add = e.target.closest('[data-add]');
    const rm = e.target.closest('[data-rm]');
    if (add && TEAM.length < 6 && !TEAM.includes(add.dataset.add)) TEAM.push(add.dataset.add);
    else if (rm) TEAM = TEAM.filter(n => n !== rm.dataset.rm);
    else return;
    try { localStorage.setItem(KEY + ':team', JSON.stringify(TEAM)); } catch (err) {}
    drawPlanner(el);
  });
};
function typesOf(name){ const p = POOL.find(x => x[0] === name); return p ? p[1] : []; }
function drawPlanner(el){
  const slots = el.querySelector('#slots');
  slots.innerHTML = Array.from({length:6}, (_, i) => {
    const n = TEAM[i];
    if (!n) return '<div class="slot"><span class="empty">slot ' + (i + 1) + '</span></div>';
    return '<div class="slot filled"><button class="x" data-rm="' + esc(n) + '" aria-label="Remove ' + esc(n) + '">×</button>' +
      '<div class="sn">' + esc(n) + '</div><div class="st">' + tpills(typesOf(n)) + '</div></div>';
  }).join('');

  el.querySelector('#pool').innerHTML = POOL.map(p =>
    '<button data-add="' + esc(p[0]) + '"' + (TEAM.includes(p[0]) || TEAM.length >= 6 ? ' disabled' : '') + '>' + esc(p[0]) + '</button>').join('');

  const cov = el.querySelector('#coverage');
  if (!TEAM.length){ cov.innerHTML = ''; return; }
  const members = TEAM.map(n => typesOf(n));
  const weak = TYPES.map(t => [t, members.filter(m => eff(t, m) >= 2).length]);
  const gaps = TYPES.filter(d => !TEAM.some(n => typesOf(n).some(s => eff(s, [d]) >= 2)));

  cov.innerHTML =
    '<h3 style="margin-bottom:6px">Defensive exposure — how many of your six each type hits hard</h3>' +
    '<div class="cover">' + weak.map(w =>
      '<div class="cvcell ' + (w[1] >= 3 ? 'bad' : w[1] === 0 ? 'ok' : '') + '"><div class="cvt">' + w[0] +
      '</div><div class="cvv">' + w[1] + ' of ' + TEAM.length + '</div></div>').join('') + '</div>' +
    '<h3 style="margin-bottom:6px">Types nothing on your team hits for 2× with its own typing</h3>' +
    '<p style="font-size:15.5px;margin:0">' + (gaps.length
      ? gaps.map(tpill).join(' ') + '<br><span style="color:var(--ink3);font-size:14px">This is a same-type check only — a TM can plug any of these. Ice Beam, Thunderbolt and Flamethrower between them cover most gaps a Johto team has.</span>'
      : '<span style="color:var(--good)">Nothing — your six cover every type with same-type moves alone.</span>') + '</p>';
}

/* — Progress backup — */
WIDGETS.backup = function(el){
  el.innerHTML =
    '<details class="backup"><summary>Backup / restore your ticks</summary>' +
    '<textarea id="bkText" spellcheck="false" aria-label="Progress backup data"></textarea>' +
    '<div class="rowbtns"><button class="tbtn" id="bkCopy">Copy backup</button>' +
    '<button class="tbtn" id="bkLoad">Restore from box</button>' +
    '<button class="tbtn" id="bkClear">Clear all progress</button></div>' +
    '<p style="font-size:14px;color:var(--ink3);margin:10px 0 0">Ticks are stored in this browser only. Paste the string into a note if you plan to open the guide on another device.</p></details>';
  const ta = el.querySelector('#bkText');
  ta.value = JSON.stringify({done:DONE, team:TEAM});
  el.querySelector('#bkCopy').addEventListener('click', () => {
    ta.select();
    try { navigator.clipboard.writeText(ta.value); } catch (e) { document.execCommand('copy'); }
    el.querySelector('#bkCopy').textContent = 'Copied';
    setTimeout(() => { el.querySelector('#bkCopy').textContent = 'Copy backup'; }, 1400);
  });
  el.querySelector('#bkLoad').addEventListener('click', () => {
    try {
      const parsed = JSON.parse(ta.value);
      DONE = parsed.done || {};
      TEAM = parsed.team || [];
      persist();
      localStorage.setItem(KEY + ':team', JSON.stringify(TEAM));
      location.reload();
    } catch (e) {
      alert('That is not a valid backup string.');
    }
  });
  el.querySelector('#bkClear').addEventListener('click', () => {
    if (!confirm('Clear every tick and your saved team? This cannot be undone.')) return;
    DONE = {}; TEAM = [];
    persist();
    try { localStorage.removeItem(KEY + ':team'); } catch (e) {}
    location.reload();
  });
};

/* ===================== DAY SELECT + BOOT ===================== */
(function(){
  const sel = document.getElementById('daypick');
  const names = DAYS.map(d => d[0]);

  sel.innerHTML = '<option value="today">Today · ' + names[today] + '</option>' +
    names.map((n, i) => '<option value="' + i + '">' + n + '</option>').join('');
  sel.addEventListener('change', () => {
    drawDays();
    const s = document.getElementById('ref-days');
    if (s && !s.classList.contains('hide')) s.scrollIntoView({behavior:'smooth', block:'start'});
  });
  boot();
})();
