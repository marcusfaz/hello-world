<title>The Johto Circuit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=DM+Mono:wght@400;500&display=swap">

<style>
/* ─────────────────────────────────────────────
   THE JOHTO CIRCUIT
   Display  Baloo 2      — rounded, game-logo lineage
   Body     Nunito       — rounded humanist, long-form safe
   Data     DM Mono      — numeric columns only
   Colour   Pokedex blue / Poke Ball red / HeartGold amber
   ───────────────────────────────────────────── */
:root{
  --bg:#EEF3F9; --surface:#FFFFFF; --surface2:#E4EBF5; --sunk:#D5DFEC;
  --line:#D2DCEA; --line-soft:#E4EAF3;
  --ink:#16202E; --ink2:#4A5A70; --ink3:#78899F;
  --gold:#B27C08; --gold-ink:#8A5F03; --gold-wash:#FCEFC8;
  --indigo:#1F63A8; --indigo-wash:#DCEAF8;
  --ember:#C22C0B; --ember-wash:#FBE0D8;
  --good:#17714F; --good-wash:#D8EFE3;
  /* the emblem is a logo — identical in both themes */
  --ball-top:#EE1515; --ball-band:#22262E; --ball-bot:#FFFFFF;
  --shadow:0 1px 2px rgba(22,32,46,.06), 0 10px 26px -18px rgba(22,32,46,.45);
  --shadow-lg:0 2px 4px rgba(22,32,46,.06), 0 18px 40px -24px rgba(22,32,46,.5);
  --r-card:14px; --r-sm:9px; --r-pill:999px;
  --rail:268px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D131E; --surface:#161F2E; --surface2:#1F2A3B; --sunk:#0A0F18;
    --line:#2B3849; --line-soft:#222D3D;
    --ink:#EAF1F9; --ink2:#A3B4C9; --ink3:#7688A0;
    --gold:#F0B93F; --gold-ink:#FFD173; --gold-wash:#3A2C0C;
    --indigo:#71ACEA; --indigo-wash:#152233;
    --ember:#FF8464; --ember-wash:#3A1810;
    --good:#5FC79B; --good-wash:#102C22;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 30px -20px rgba(0,0,0,.9);
    --shadow-lg:0 2px 6px rgba(0,0,0,.55), 0 22px 46px -26px rgba(0,0,0,1);
  }
}
:root[data-theme="dark"]{
  --bg:#0D131E; --surface:#161F2E; --surface2:#1F2A3B; --sunk:#0A0F18;
  --line:#2B3849; --line-soft:#222D3D;
  --ink:#EAF1F9; --ink2:#A3B4C9; --ink3:#7688A0;
  --gold:#F0B93F; --gold-ink:#FFD173; --gold-wash:#3A2C0C;
  --indigo:#71ACEA; --indigo-wash:#152233;
  --ember:#FF8464; --ember-wash:#3A1810;
  --good:#5FC79B; --good-wash:#102C22;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 30px -20px rgba(0,0,0,.9);
  --shadow-lg:0 2px 6px rgba(0,0,0,.55), 0 22px 46px -26px rgba(0,0,0,1);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Nunito","Segoe UI",Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.6; font-weight:400;
}
h1,h2,h3,h4,.dsp{font-family:"Baloo 2","Nunito",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.005em;text-wrap:balance;line-height:1.18;margin:0}
.mono,code,kbd,td.num,.num{font-family:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
code,kbd{background:var(--surface2);border-radius:5px;padding:1px 5px;font-size:.88em}
a{color:var(--indigo);text-underline-offset:2px;font-weight:600}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* the Poke Ball emblem, drawn in CSS */
.ball{display:inline-block;border-radius:50%;flex:0 0 auto;
  background:
    radial-gradient(circle at 50% 50%, var(--ball-bot) 0 20%, var(--ball-band) 20% 30%, transparent 30%),
    linear-gradient(180deg, var(--ball-top) 0 44%, var(--ball-band) 44% 56%, var(--ball-bot) 56% 100%);
  box-shadow:inset 0 0 0 1.5px var(--ball-band);
}

/* ── shell ── */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);max-width:1460px;margin:0 auto;min-height:100vh}
.rail{
  position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border-right:1px solid var(--line);padding:20px 0 40px;
}
.rail::-webkit-scrollbar{width:9px}
.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.scrim{position:fixed;inset:0;background:rgba(6,12,22,.55);z-index:55;display:none}

.brand{padding:0 20px 16px;border-bottom:1px solid var(--line-soft);margin-bottom:14px}
.brand .wing{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ember);margin-bottom:7px}
.brand .wing .ball{width:16px;height:16px}
.brand h1{font-size:26px;line-height:1.02}
.brand p{margin:7px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.45}

.meter{display:flex;align-items:center;gap:9px;padding:10px 20px 14px}
.meter .bar{flex:1;height:9px;background:var(--sunk);border-radius:var(--r-pill);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.14)}
.meter .bar i{display:block;height:100%;width:0;border-radius:var(--r-pill);transition:width .35s ease;
  background-color:var(--gold);
  background-image:linear-gradient(180deg,#FFD84D 0%,var(--gold) 60%,#9A6B05 100%)}
.meter .pct{font-family:"DM Mono",monospace;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}

.navgroup{margin:0 0 6px}
.navgroup > .ghead{
  display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;
  padding:11px 20px 5px;background:none;border:0;cursor:pointer;
  font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
}
.navgroup > .ghead .gcount{margin-left:auto;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums;font-family:"DM Mono",monospace}
.navlist{list-style:none;margin:0;padding:0}
.navlist a{
  display:flex;gap:9px;align-items:flex-start;margin:1px 10px;border-radius:var(--r-sm);
  padding:7px 11px;font-weight:600;font-size:14px;line-height:1.3;color:var(--ink2);text-decoration:none;
}
.navlist a:hover{color:var(--ink);background:var(--surface2)}
.navlist a.on{color:var(--ink);background:var(--gold-wash);box-shadow:inset 0 0 0 1.5px var(--gold)}
.navlist a .tick{flex:0 0 auto;width:14px;height:14px;margin-top:3px;border:2px solid var(--line);border-radius:50%;background:var(--surface)}
.navlist a.done .tick{border:0;
  background:radial-gradient(circle at 50% 50%, var(--ball-bot) 0 20%, var(--ball-band) 20% 32%, transparent 32%),
             linear-gradient(180deg, var(--ball-top) 0 44%, var(--ball-band) 44% 56%, var(--ball-bot) 56% 100%);
  box-shadow:inset 0 0 0 1.5px var(--ball-band)}
.navlist a .n{font-family:"DM Mono",monospace;font-size:11px;color:var(--ink3);margin-top:1px}

/* ── main ── */
.main{min-width:0;padding:0 0 120px}
.topbar{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 95%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;gap:10px;align-items:center;padding:11px 28px;flex-wrap:wrap;
}
.menubtn{display:none}
.searchwrap{position:relative;flex:1;min-width:180px;max-width:420px}
.searchwrap input{
  width:100%;padding:9px 12px 9px 34px;border:2px solid var(--line);border-radius:var(--r-pill);
  background:var(--surface);color:var(--ink);font-family:inherit;font-size:14px;font-weight:600;
}
.searchwrap input:focus{border-color:var(--indigo);outline:none}
.searchwrap input::placeholder{color:var(--ink3);font-weight:400}
.searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink3);fill:none;stroke-width:2.4}
.tbtn{
  border:2px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:7px 14px;cursor:pointer;
  font-size:12.5px;font-weight:800;letter-spacing:.02em;color:var(--ink2);white-space:nowrap;
}
.tbtn:hover{border-color:var(--gold);color:var(--ink)}
.tbtn[aria-pressed="true"]{background:var(--gold-wash);border-color:var(--gold);color:var(--gold-ink)}
.daypick{
  border:2px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:7px 11px;
  font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;
}
.daypick:hover{border-color:var(--gold)}

.wrap{padding:0 28px;max-width:920px}
.wrap.wide{max-width:1100px}

/* ── stages ── */
.stage{padding:44px 0 8px;border-bottom:1px solid var(--line-soft);scroll-margin-top:70px}
.stage:last-child{border-bottom:0}
.stage.hide{display:none}
.eyebrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:13px}
.eyebrow .tag{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#fff;
  background-color:#2A6FB8;
  background-image:linear-gradient(135deg,#2A6FB8,#1B4478);
  padding:5px 12px;border-radius:var(--r-pill)}
.eyebrow .where{font-size:12.5px;font-weight:700;color:var(--ink3)}
.stage h2{font-size:clamp(28px,3.6vw,38px);margin-bottom:10px}
.lede{font-size:18.5px;color:var(--ink2);margin:0 0 22px;max-width:66ch}
.stage p{max-width:68ch}
.stage h3{font-size:12.5px;font-weight:800;text-transform:uppercase;color:var(--ink3);margin:32px 0 10px;letter-spacing:.12em}
.stage ul.plain{max-width:68ch;padding-left:22px;margin:10px 0}
.stage ul.plain li{margin:6px 0}

.band{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;margin:0 0 24px;background:var(--surface);box-shadow:var(--shadow)}
.band div{padding:11px 16px;border-right:1px solid var(--line-soft);flex:1;min-width:132px}
.band div:last-child{border-right:0}
.band dt{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.band dd{margin:0;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.2}

/* ── checklists ── */
.checks{list-style:none;margin:12px 0 6px;padding:0;max-width:70ch}
.checks li{display:flex;gap:11px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.checks li:last-child{border-bottom:0}
.checks input{
  appearance:none;-webkit-appearance:none;flex:0 0 auto;margin:4px 0 0;
  width:19px;height:19px;border:2px solid var(--line);border-radius:50%;background:var(--surface);cursor:pointer;position:relative;
}
.checks input:hover{border-color:var(--gold)}
.checks input:checked{border:0;
  background:radial-gradient(circle at 50% 50%, var(--ball-bot) 0 21%, var(--ball-band) 21% 31%, transparent 31%),
             linear-gradient(180deg, var(--ball-top) 0 44%, var(--ball-band) 44% 56%, var(--ball-bot) 56% 100%);
  box-shadow:inset 0 0 0 2px var(--ball-band)}
.checks label{cursor:pointer;font-size:16.5px}
.checks input:checked + label{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line)}
.checks .sub{display:block;font-size:14.5px;color:var(--ink3);font-weight:600;margin-top:2px}
li.doneRow.hidden{display:none}

/* ── callouts ── */
.note{border:2px solid var(--line);border-radius:var(--r-card);padding:14px 17px;margin:18px 0;background:var(--surface);max-width:70ch}
.note .lbl{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:5px}
.note p{margin:0;font-size:16px}
.note.tip{background:var(--indigo-wash);border-color:color-mix(in srgb,var(--indigo) 32%,transparent)}
.note.tip .lbl{color:var(--indigo)}
.note.warn{background:var(--ember-wash);border-color:color-mix(in srgb,var(--ember) 38%,transparent)}
.note.warn .lbl{color:var(--ember)}
.note.team{background:var(--gold-wash);border-color:color-mix(in srgb,var(--gold) 42%,transparent)}
.note.team .lbl{color:var(--gold-ink)}

/* ── cards ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:11px;margin:12px 0}
.card{border:1px solid var(--line);border-radius:var(--r-card);padding:13px 15px;background:var(--surface);box-shadow:var(--shadow)}
.card .nm{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:16px;line-height:1.25;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.card .loc{font-size:12px;font-weight:700;color:var(--ink3);margin-top:4px;display:block}
.card .why{font-size:14.5px;color:var(--ink2);margin-top:6px;line-height:1.45}
.kchip{font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:var(--r-pill);background:var(--surface2);color:var(--ink2);text-transform:uppercase}
.kchip.tm{background:var(--indigo-wash);color:var(--indigo)}
.kchip.hm{background:var(--gold-wash);color:var(--gold-ink)}
.kchip.key{background:var(--ember-wash);color:var(--ember)}

/* ── gym leader / boss dossier: banded in the leader's type colour ── */
.boss{border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;margin:24px 0;background:var(--surface);box-shadow:var(--shadow-lg)}
.boss .bh{--tc:#8A8AA8;padding:16px 19px;display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;
  background-color:color-mix(in srgb,var(--tc) 50%,#000);
  background-image:linear-gradient(135deg,color-mix(in srgb,var(--tc) 50%,#000) 0%,color-mix(in srgb,var(--tc) 30%,#000) 100%);
  color:#fff}
.boss .bh h4{font-size:24px;color:#fff}
.boss .bh .role{font-size:12px;font-weight:700;color:rgba(255,255,255,.82)}
.boss .bh .badge{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.2);padding:4px 11px;border-radius:var(--r-pill)}
.tblwrap{overflow-x:auto}
.tblwrap table{min-width:540px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{
  font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
  text-align:left;padding:10px 15px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--surface2);
}
td{padding:9px 15px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
td.mon{font-family:"Baloo 2",sans-serif;font-weight:800;white-space:nowrap;font-size:15.5px}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink2);font-weight:500}
td.mv{color:var(--ink2);font-size:14px}
.boss .plan{padding:15px 19px;border-top:1px solid var(--line)}
.boss .plan ul{margin:8px 0 0;padding-left:21px}
.boss .plan li{margin:7px 0;font-size:16px}
.boss .plan .lbl{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}

/* ── type chips: one hue token drives both themes ── */
.t{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap;--tc:#8A8478;
  background:color-mix(in srgb,var(--tc) 30%,#FFFFFF);
  color:color-mix(in srgb,var(--tc) 46%,#14120E)}
.ty-normal{--tc:#A8A878}.ty-fire{--tc:#F08030}.ty-water{--tc:#6890F0}.ty-electric{--tc:#E8B800}
.ty-grass{--tc:#5FB43C}.ty-ice{--tc:#5FBFBF}.ty-fighting{--tc:#C03028}.ty-poison{--tc:#A040A0}
.ty-ground{--tc:#C9A23C}.ty-flying{--tc:#8E7BE8}.ty-psychic{--tc:#F04A76}.ty-bug{--tc:#8FA018}
.ty-rock{--tc:#B8A038}.ty-ghost{--tc:#705898}.ty-dragon{--tc:#7038F8}.ty-dark{--tc:#6B5344}
.ty-steel{--tc:#8A8AA8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .t{
  background:color-mix(in srgb,var(--tc) 24%,#000000);
  color:color-mix(in srgb,var(--tc) 55%,#FFFFFF)}}
:root[data-theme="dark"] .t{
  background:color-mix(in srgb,var(--tc) 24%,#000000);
  color:color-mix(in srgb,var(--tc) 55%,#FFFFFF)}

/* ── reference tables ── */
.reftable{border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;background:var(--surface);margin:18px 0;box-shadow:var(--shadow)}
.reftable .rh{display:flex;gap:10px;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line);background:var(--surface2);flex-wrap:wrap}
.reftable .rh input{flex:1;min-width:150px;padding:7px 13px;border:2px solid var(--line);border-radius:var(--r-pill);background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;font-weight:600}
.reftable td .have{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:2px solid var(--line);border-radius:50%;background:var(--bg);cursor:pointer;position:relative;vertical-align:-3px}
.reftable td .have:checked{border:0;
  background:radial-gradient(circle at 50% 50%, var(--ball-bot) 0 21%, var(--ball-band) 21% 31%, transparent 31%),
             linear-gradient(180deg, var(--ball-top) 0 44%, var(--ball-band) 44% 56%, var(--ball-bot) 56% 100%);
  box-shadow:inset 0 0 0 2px var(--ball-band)}
tr.rowhide{display:none}

/* ── day board ── */
.dayboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:16px 0}
.daycard{border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);padding:14px 16px;box-shadow:var(--shadow)}
.daycard.today{border:2px solid var(--gold);background:var(--gold-wash)}
.daycard h4{font-size:17px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.daycard h4 .mk{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}
.daycard ul{margin:0;padding-left:19px;font-size:14.5px}
.daycard li{margin:5px 0;line-height:1.45}

/* ── team planner ── */
.planner{border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);padding:18px 20px;margin:18px 0;box-shadow:var(--shadow)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0 4px}
.slot{border:2px dashed var(--line);border-radius:var(--r-card);padding:10px 12px;min-height:66px;position:relative;background:var(--bg)}
.slot.filled{border-style:solid;background:var(--surface2)}
.slot .sn{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:15.5px}
.slot .st{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
.slot .x{position:absolute;top:4px;right:6px;border:0;background:none;cursor:pointer;color:var(--ink3);font-size:16px;line-height:1;padding:2px 4px}
.slot .x:hover{color:var(--ember)}
.slot .empty{color:var(--ink3);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.pool{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;max-height:190px;overflow-y:auto;padding:2px}
.pool button{
  border:2px solid var(--line);background:var(--bg);border-radius:var(--r-pill);padding:5px 13px;cursor:pointer;
  font-family:inherit;font-weight:700;font-size:13px;
}
.pool button:hover{border-color:var(--gold);background:var(--gold-wash)}
.pool button[disabled]{opacity:.38;cursor:default}
.cover{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:7px;margin-top:14px}
.cvcell{border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:8px 10px;background:var(--bg)}
.cvcell .cvt{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.cvcell .cvv{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:15px;margin-top:2px}
.cvcell.bad{background:var(--ember-wash)}
.cvcell.ok{background:var(--good-wash)}

/* ── the single next action ── */
.donow{border:2px solid var(--gold);border-radius:var(--r-card);background-color:var(--gold-wash);background-image:linear-gradient(135deg,var(--gold-wash),color-mix(in srgb,var(--gold-wash) 55%,var(--surface)));padding:15px 18px;margin:4px 0 18px;box-shadow:var(--shadow)}
.donow .lbl{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:7px}
.donow .lbl::before{content:"";width:13px;height:13px;border-radius:50%;

    </div>
    <div id="content"></div>

<script>
/* ============================================================
   Engine: data containers, persistence, rendering, widgets.
   Content is appended by the DATA scripts that follow.
   ============================================================ */
const CHAPTERS = [];
const STAGES = [];
const WIDGETS = {};                 // id -> function(mountEl)

/* ---- persistence (per-browser; export/import below) ---- */
const KEY = 'johto-circuit-v1';
let DONE = {};
try { DONE = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { DONE = {}; }
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(DONE)); } catch (e) {} }

/* stable id from text so progress survives edits elsewhere in the page */
function key(scope, text){
  let h = 5381;
  const s = scope + '|' + text;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return scope + '-' + h.toString(36);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tpill = t => '<span class="t ty-' + String(t).toLowerCase() + '">' + esc(t) + '</span>';
const tpills = a => (a || []).map(tpill).join(' ');

/* ---- block renderers ---- */
function renderBlock(b, stageId){
  const kind = b[0], v = b[1];
  switch (kind){
    case 'p':    return '<p>' + v + '</p>';
    case 'h':    return '<h3>' + esc(v) + '</h3>';
    case 'ul':   return '<ul class="plain">' + v.map(x => '<li>' + x + '</li>').join('') + '</ul>';
    case 'tip':  return '<div class="note tip"><span class="lbl">Worth knowing</span><p>' + v + '</p></div>';
    case 'warn': return '<div class="note warn"><span class="lbl">Don\'t miss / can\'t undo</span><p>' + v + '</p></div>';
    case 'team': return '<div class="note team"><span class="lbl">Team call</span><p>' + v + '</p></div>';
    case 'html': return v;
    case 'mount':return '<div data-widget="' + esc(v) + '"></div>';
    case 'roster':return '<div data-roster="' + esc(v) + '"></div>';

    case 'do': return '<ul class="checks">' + v.map(item => {
        const t = typeof item === 'string' ? item : item.t;
        const sub = (typeof item === 'object' && item.sub) ? '<span class="sub">' + item.sub + '</span>' : '';
        const id = key(stageId, t);
        const on = !!DONE[id];
        return '<li class="doneRow' + (on ? ' isdone' : '') + '" data-k="' + id + '">' +
          '<input type="checkbox" id="' + id + '" data-k="' + id + '"' + (on ? ' checked' : '') + '>' +
          '<label for="' + id + '">' + t + sub + '</label></li>';
      }).join('') + '</ul>';

    case 'catch': return '<div class="grid">' + v.map(c =>
        '<div class="card"><div class="nm">' + esc(c.n) + ' ' + tpills(c.t) + '</div>' +
        '<span class="loc">' + esc(c.where) + '</span>' +
        (c.why ? '<div class="why">' + c.why + '</div>' : '') + '</div>').join('') + '</div>';

    case 'loot': return '<div class="grid">' + v.map(i => {
        const cls = /^TM/.test(i.k) ? 'tm' : /^HM/.test(i.k) ? 'hm' : i.k === 'Key' ? 'key' : '';
        return '<div class="card"><div class="nm"><span class="kchip ' + cls + '">' + esc(i.k) + '</span> ' + esc(i.n) + '</div>' +
          '<span class="loc">' + esc(i.where) + '</span>' + (i.why ? '<div class="why">' + i.why + '</div>' : '') + '</div>';
      }).join('') + '</div>';

    case 'table': return '<div class="reftable"><div class="tblwrap"><table><thead><tr>' +
        v.cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
        v.rows.map(r => '<tr>' + r.map((c, i) => '<td' + (i ? ' class="mv"' : ' class="mon"') + '>' + c + '</td>').join('') + '</tr>').join('') +
        '</tbody></table></div></div>';

    case 'boss': {
      const b2 = v;
      const roleType = String(b2.role).split('\u00b7').pop().trim().toLowerCase();
      const bhType = TYPES.some(t => t.toLowerCase() === roleType) ? ' ty-' + roleType : '';
      return '<div class="boss"><div class="bh' + bhType + '"><h4>' + esc(b2.name) + '</h4>' +
        '<span class="role">' + esc(b2.role) + '</span>' +
        (b2.badge ? '<span class="badge">' + esc(b2.badge) + '</span>' : '') + '</div>' +
        '<div class="tblwrap"><table><thead><tr><th>Pokémon</th><th>Lv</th><th>Type</th><th>Watch for</th></tr></thead><tbody>' +
        b2.team.map(m => '<tr><td class="mon">' + esc(m.m) + '</td><td class="num">' + esc(m.l) +
          '</td><td>' + tpills(m.t) + '</td><td class="mv">' + (m.note || '') + '</td></tr>').join('') +
        '</tbody></table></div>' +
        '<div class="plan"><span class="lbl">How you win</span><ul>' +
        b2.plan.map(p => '<li>' + p + '</li>').join('') + '</ul>' +
        (b2.reward ? '<p style="margin:12px 0 0;font-size:15px;color:var(--ink2)"><b>Reward:</b> ' + b2.reward + '</p>' : '') +
        '</div></div>';
    }
  }
  return '';
}

/* ---- page render ---- */
function renderAll(){
  const content = document.getElementById('content');
  content.innerHTML = STAGES.map(s => {
    const band = (s.band || []).length
      ? '<dl class="band">' + s.band.map(x => '<div><dt>' + esc(x.k) + '</dt><dd>' + x.v + '</dd></div>').join('') + '</dl>'
      : '';
    return '<section class="stage" id="' + s.id + '"><div class="wrap' + (s.wide ? ' wide' : '') + '">' +
      '<div class="eyebrow"><span class="tag">' + esc(s.tag || chapterOf(s).name) + '</span>' +
      (s.place ? '<span class="where">' + esc(s.place) + '</span>' : '') + '</div>' +
      '<h2>' + esc(s.title) + '</h2>' +
      (s.lede ? '<p class="lede">' + s.lede + '</p>' : '') + band +
      s.body.map(b => renderBlock(b, s.id)).join('') +
      '</div></section>';
  }).join('');

  content.querySelectorAll('[data-widget]').forEach(el => {
    const fn = WIDGETS[el.dataset.widget];
    if (fn) fn(el);
  });
  renderRosters();

  content.addEventListener('change', e => {
    const cb = e.target.closest('input[type=checkbox][data-k]');
    if (!cb) return;
    if (cb.checked) DONE[cb.dataset.k] = 1; else delete DONE[cb.dataset.k];
    persist();
    const row = cb.closest('.doneRow');
    if (row) row.classList.toggle('isdone', cb.checked);
    updateProgress();
    applyHideDone();
  });

  renderNav();
  updateProgress();
}
function chapterOf(s){ return CHAPTERS.find(c => c.id === s.ch) || {name:''}; }

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = CHAPTERS.map(c => {
    const list = STAGES.filter(s => s.ch === c.id);
    return '<div class="navgroup"><div class="ghead">' + esc(c.name) +
      '<span class="gcount" data-chcount="' + c.id + '"></span></div><ul class="navlist">' +
      list.map(s => '<li><a href="#' + s.id + '" data-nav="' + s.id + '">' +
        '<span class="tick"></span><span>' + esc(s.title) + '</span></a></li>').join('') +
      '</ul></div>';
  }).join('');
  nav.addEventListener('click', e => {
    if (e.target.closest('a') && window.innerWidth <= 960) closeRail();
  });
}

function stageStats(s){
  let total = 0, done = 0;
  document.querySelectorAll('#' + CSS.escape(s.id) + ' input[type=checkbox][data-k]').forEach(cb => {
    total++; if (cb.checked) done++;
  });
  return {total, done};
}
function updateProgress(){
  let gT = 0, gD = 0;
  const perCh = {};
  STAGES.forEach(s => {
    const st = stageStats(s);
    gT += st.total; gD += st.done;
    perCh[s.ch] = perCh[s.ch] || {t:0, d:0, stages:0, full:0};
    perCh[s.ch].t += st.total; perCh[s.ch].d += st.done; perCh[s.ch].stages++;
    if (st.total && st.done === st.total) perCh[s.ch].full++;
    const a = document.querySelector('[data-nav="' + s.id + '"]');
    if (a) a.classList.toggle('done', st.total > 0 && st.done === st.total);
  });
  CHAPTERS.forEach(c => {
    const el = document.querySelector('[data-chcount="' + c.id + '"]');
    const p = perCh[c.id];
    if (el && p) el.textContent = p.full + '/' + p.stages;
  });
  const pct = gT ? Math.round(gD / gT * 100) : 0;
  document.getElementById('globalbar').style.width = pct + '%';
  document.getElementById('globalpct').textContent = pct + '%';
  document.getElementById('globalpct').title = gD + ' of ' + gT + ' steps';
}

/* ---- search ---- */
function runSearch(q){
  q = q.trim().toLowerCase();
  const stages = document.querySelectorAll('.stage');
  let shown = 0;
  stages.forEach(el => {
    const hit = !q || el.textContent.toLowerCase().includes(q);
    el.classList.toggle('hide', !hit);
    if (hit) shown++;
  });
  let msg = document.getElementById('nores');
  if (!msg){
    msg = document.createElement('div');
    msg.id = 'nores'; msg.className = 'wrap nores';
    document.getElementById('content').appendChild(msg);
  }
  msg.style.display = shown ? 'none' : 'block';
  msg.textContent = 'Nothing matches “' + q + '”.';
  document.querySelectorAll('[data-nav]').forEach(a => {
    const s = document.getElementById(a.dataset.nav);
    a.parentElement.style.display = (!s || s.classList.contains('hide')) ? 'none' : '';
  });
}

/* ---- hide done ---- */
let HIDE = false;
function applyHideDone(){
  document.querySelectorAll('.doneRow').forEach(li => {
    li.classList.toggle('hidden', HIDE && li.classList.contains('isdone'));
  });
}

/* ---- theme ---- */
function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem(KEY + ':theme'); } catch (e) {}
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themebtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const next = cur ? (cur === 'dark' ? 'light' : 'dark') : (sysDark ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(KEY + ':theme', next); } catch (e) {}
  });
}

/* ---- rail (mobile) ---- */
function closeRail(){
  document.getElementById('rail').classList.remove('open');
  document.getElementById('scrim').classList.remove('on');
}
/* ---- scrollspy ---- */
function initSpy(){
  const obs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      document.querySelectorAll('[data-nav]').forEach(a => a.classList.remove('on'));
      const a = document.querySelector('[data-nav="' + en.target.id + '"]');
      if (a){ a.classList.add('on'); }
    });
  }, {rootMargin:'-56px 0px -70% 0px', threshold:0});
  document.querySelectorAll('.stage').forEach(s => obs.observe(s));
}

/* ---- Gen IV type chart (no Fairy; Steel resists Ghost & Dark) ---- */
const TYPES = ['Normal','Fire','Water','Electric','Grass','Ice','Fighting','Poison','Ground','Flying','Psychic','Bug','Rock','Ghost','Dragon','Dark','Steel'];
const CHART = {
  Normal:{Rock:.5,Ghost:0,Steel:.5},
  Fire:{Fire:.5,Water:.5,Grass:2,Ice:2,Bug:2,Rock:.5,Dragon:.5,Steel:2},
  Water:{Fire:2,Water:.5,Grass:.5,Ground:2,Rock:2,Dragon:.5},
  Electric:{Water:2,Electric:.5,Grass:.5,Ground:0,Flying:2,Dragon:.5},
  Grass:{Fire:.5,Water:2,Grass:.5,Poison:.5,Ground:2,Flying:.5,Bug:.5,Rock:2,Dragon:.5,Steel:.5},
  Ice:{Fire:.5,Water:.5,Grass:2,Ice:.5,Ground:2,Flying:2,Dragon:2,Steel:.5},
  Fighting:{Normal:2,Ice:2,Poison:.5,Flying:.5,Psychic:.5,Bug:.5,Rock:2,Ghost:0,Dark:2,Steel:2},
  Poison:{Grass:2,Poison:.5,Ground:.5,Rock:.5,Ghost:.5,Steel:0},
  Ground:{Fire:2,Electric:2,Grass:.5,Poison:2,Flying:0,Bug:.5,Rock:2,Steel:2},
  Flying:{Electric:.5,Grass:2,Fighting:2,Bug:2,Rock:.5,Steel:.5},
  Psychic:{Fighting:2,Poison:2,Psychic:.5,Dark:0,Steel:.5},
  Bug:{Fire:.5,Grass:2,Fighting:.5,Poison:.5,Flying:.5,Psychic:2,Ghost:.5,Dark:2,Steel:.5},
  Rock:{Fire:2,Ice:2,Fighting:.5,Ground:.5,Flying:2,Bug:2,Steel:.5},
  Ghost:{Normal:0,Psychic:2,Ghost:2,Dark:.5,Steel:.5},
  Dragon:{Dragon:2,Steel:.5},
  Dark:{Fighting:.5,Psychic:2,Ghost:2,Dark:.5,Steel:.5},
  Steel:{Fire:.5,Water:.5,Electric:.5,Ice:2,Rock:2,Steel:.5}
};
function eff(atk, defTypes){
  return defTypes.reduce((m, d) => m * (CHART[atk] && CHART[atk][d] !== undefined ? CHART[atk][d] : 1), 1);
}

/* ---- boot ---- */
function boot(){
  initTheme();
  renderAll();
  initSpy();
  document.getElementById('search').addEventListener('input', e => runSearch(e.target.value));
  document.getElementById('hidedone').addEventListener('click', e => {
    HIDE = !HIDE;
    e.currentTarget.setAttribute('aria-pressed', String(HIDE));
    applyHideDone();
  });
  document.getElementById('menubtn').addEventListener('click', () => {
    document.getElementById('rail').classList.add('open');
    document.getElementById('scrim').classList.add('on');
  });
  document.getElementById('scrim').addEventListener('click', closeRail);
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT'){
      e.preventDefault(); document.getElementById('search').focus();
    }
    if (e.key === 'Escape') closeRail();
  });
  applyHideDone();
}
</script>

["h","Sanity check before you commit to a save"],
["do",[
 "Confirm the in-game clock in the Pokégear matches the Deck's clock, and that the time-of-day tint (morning / day / night) looks right.",
 "Confirm the touch screen responds to your trackpad — open the bag, tap an item.",
 "Confirm fast-forward works and does not desync audio badly."
]]
]});

STAGES.push({
id:"set-controls", ch:"setup", tag:"Setup 02", place:"Steam Input",
title:"Controls, the stylus problem, and the clock",
lede:"Two things will bite you on a handheld: this game has touch-only minigames, and it silently punishes you for messing with the system date.",
body:[
["h","Give yourself a stylus"],
["p","Several things in HeartGold cannot be done with buttons. The Pokéathlon events are entirely touch-driven, Voltorb Flip is a grid you tap, the Safari Zone block placement is drag-and-drop, and the Sinjoh Ruins ritual asks you to draw. Set this up now:"],
["do",[
 {t:"Map the <b>right trackpad</b> to <i>Mouse</i> in the Steam Input layout.", sub:"Trackpad as mouse gives you absolute-ish pointer control, which beats the stick for the Pokéathlon."},
 {t:"Map <b>right trackpad click</b> (or <kbd>R2</kbd>) to <i>Left Mouse Click</i> — that is your stylus tap.", sub:"melonDS treats a left click inside the bottom screen as a touch."},
 {t:"Turn trackpad haptics up a little so taps feel deliberate.", sub:"You will be tapping fast in the Pokéathlon; feedback matters."}
]],
["h","Hotkeys worth memorising"],
["table",{cols:["Action","Default (EmuDeck)","When you use it"],rows:[
 ["Save state","<kbd>Select + R1</kbd>","Before a legendary, before the Elite Four, before a Bug Contest run"],
 ["Load state","<kbd>Select + L1</kbd>","Re-rolling a catch or a crit that killed a run"],
 ["Fast-forward","<kbd>Select + R2</kbd>","Egg hatching, Battle Frontier streaks, Apricorn round trips, EV grinding"],
 ["Pause","<kbd>Select + A</kbd>","Reading a long fight"],
 ["Swap screens","<kbd>L4</kbd> / <kbd>R4</kbd>","Making the Pokégear map or a puzzle readable"],
 ["Exit fullscreen","<kbd>Select + R3</kbd>","Getting to melonDS' own menus mid-session"]
]}],
["h","The clock rule"],
["p","HeartGold reads the console clock constantly. Day/night changes which Pokémon spawn, gates Espeon and Umbreon evolutions, and drives the whole weekly calendar — the Bug-Catching Contest, the Week Siblings, the Lake of Rage Wednesday man, Friday Lapras, the Goldenrod lottery, and the Pokéathlon shop rotation."],
["warn","Do <b>not</b> roll the Deck's clock forward or backward to farm daily events. Gen 4 notices, and daily/weekly events stall until real time catches up — you can lock yourself out of a day of progress for no gain. If you need a specific day's content, play the rest of the guide until that day comes round — this guide's <a href=\"#ref-days\">day planner</a> tells you what each day is worth."],
["tip","One clock change is usually harmless and sometimes necessary: setting the console to your actual local time <i>before</i> you start a new save. Do it once, at the beginning, then leave it alone."]
]});

STAGES.push({
id:"set-limits", ch:"setup", tag:"Setup 03", place:"Emulation caveats",
title:"Saves, trading, and the three things emulation can’t give you",
lede:"Read this before you get 40 hours in. Two of the four “100%” blockers have clean workarounds on a Deck; one does not.",
body:[
["h","Saving properly"],
["do",[
 {t:"Always use the <b>in-game save</b> as your source of truth.", sub:"That writes the .sav in Emulation/saves/melonds/saves — the file that survives emulator updates."},
 {t:"Treat save states as a convenience, not a backup.", sub:"They embed emulator internals and can break across melonDS versions. Never rely on one to hold a legendary you did not also in-game save after catching."},
 {t:"Copy your .sav somewhere synced before each legendary, the Elite Four, and anything involving the Battle Frontier.", sub:"A one-line cron or a Syncthing folder is enough. Losing 60 hours to a corrupted flash write is a real thing that happens."}
]],
["h","Trade evolutions"],
["p","Nine species in this game evolve only by trading, and you need them for the Pokédex. The good news: melonDS emulates <b>local wireless</b>, so you can run two instances on the Deck (or one on the Deck and one on a PC on the same network) with two separate save files and trade with yourself."],
["table",{cols:["Pokémon","Becomes","Condition"],rows:[
 ["Kadabra","Alakazam","Trade"],
 ["Machoke","Machamp","Trade"],
 ["Graveler","Golem","Trade"],
 ["Haunter","Gengar","Trade"],
 ["Onix","Steelix","Trade holding Metal Coat"],
 ["Scyther","Scizor","Trade holding Metal Coat"],
 ["Poliwhirl","Politoed","Trade holding King’s Rock"],
 ["Slowpoke","Slowking","Trade holding King’s Rock"],
 ["Seadra","Kingdra","Trade holding Dragon Scale"],
 ["Porygon → Porygon2","Porygon-Z","Trade with Up-Grade, then Dubious Disc"],
 ["Clamperl","Huntail / Gorebyss","Trade with DeepSeaTooth / DeepSeaScale"],
 ["Rhydon / Electabuzz / Magmar / Feebas / Dusclops","Rhyperior / Electivire / Magmortar / Milotic / Dusknoir","Trade with the matching Gen 4 item"]
]}],
["tip","The Metal Coat is easy: the traded Magneton in the Kanto Power Plant is holding one, wild Magnemite/Magneton and Steelix can hold them, and the Pokéathlon shop sells them. King’s Rock is in Slowpoke Well. Dragon Scale comes off wild Dratini/Horsea."],
["h","The dead Wi-Fi"],
["p","Nintendo’s Wi-Fi Connection is gone, which kills the GTS, Wi-Fi trades and official Mystery Gift. Community replacement servers still stand and Gen 4 games can be pointed at them by changing the DNS in the DS Wi-Fi settings (the widely used address is <code class=\"mono\">164.132.44.106</code>). On melonDS this needs the emulator’s networking set to direct mode with libpcap, and it is genuinely fiddly on SteamOS."],
["p","What you would use it for: the event distributions that unlock content — the <b>Enigma Stone</b> (Latias in HeartGold), event <b>Celebi</b> (which triggers the Giovanni / Ilex Forest time-travel episode), and event <b>Arceus</b> (which unlocks the Sinjoh Ruins and a level 1 Dialga, Palkia or Giratina)."],
["warn","Those three are the difference between “finished the game” and a literal complete National Dex. If the DNS route defeats you, the pragmatic alternative is <b>PKHeX</b> (runs on the Deck in Desktop Mode) to inject the event <i>gift</i> with correct, legal event data, then claim it in-game. That preserves the actual gameplay — you still play the Sinjoh Ruins episode — while skipping a dead server."],
["h","The Pokéwalker"],
["p","The Pokéwalker talked to the cartridge over infrared. melonDS does not emulate that link and no Deck-side accessory replaces it. You lose the walker’s exclusive routes, its item drops, and a set of special moves only obtainable there."],
["p","There is no clean in-game workaround, so here is the call to make once and stop thinking about:"],
["ul",[
 "<b>Install PKHeX and use it for exactly two things:</b> the three event gifts above, and the Pokéwalker-route entries. Both are content that was distributed by hardware or servers that no longer exist — you are restoring access, not skipping gameplay. You still play the Sinjoh Ruins and Ilex Forest episodes yourself.",
 "<b>Do not use it for anything else.</b> No generated team, no injected legendaries you could catch, no edited stats. Everything else in this guide is reachable by playing, and injecting it is how a 100-hour file stops being worth finishing."
]],
["h","Migrating from Gen 3"],
["p","Pal Park needs a GBA cartridge in the DS slot-2. melonDS can insert a GBA ROM into that slot, so migration from Ruby / Sapphire / Emerald / FireRed / LeafGreen works if you have those ROMs and their saves. It is the cheapest way to fill big blocks of the National Dex — six Pokémon per day, per game."],
["do",[
 "Install PKHeX in Desktop Mode and set your rule: event gifts and Pokéwalker entries only.",
 "Set up a second melonDS instance + a throwaway save now, so trade evolutions are never a blocker later.",
 "Back up your .sav for the first time."
]]
]});
</script>
<script>
/* ===================== CORE ===================== */
STAGES.push({
id:"core-rules", ch:"core", tag:"Fundamentals", place:"Generation IV",
title:"The Gen 4 rules that decide your fights",
lede:"Four mechanics separate this game from a modern Pokémon title. Get these wrong and half the guide’s advice will look like nonsense.",
body:[
["h","1 · There is no Fairy type"],
["p","Fairy arrived in Gen 6. In HeartGold, <b>Clefairy is pure Normal</b>, <b>Mr. Mime is pure Psychic</b>, and Dragon has exactly two answers: Ice and Dragon. That is why Clair is the wall she is, and why an Ice move is worth a permanent team slot."],
["h","2 · Steel resists Ghost and Dark"],
["p","In Gen 4, Steel resists <i>eleven</i> types including Ghost and Dark — those resistances were removed in Gen 6. Practically: your Shadow Ball and Crunch are half-power against Steelix, Magneton, Forretress and Skarmory. Bring Fire, Fighting or Ground to those fights instead."],
["h","3 · The physical/special split exists — use it"],
["p","Gen 4 was the split. Damage is decided per move, not per type, so Gyarados can run Waterfall off its huge Attack and Ampharos can run Thunderbolt off Special Attack. Two consequences worth acting on:"],
["ul",[
 "Check which stat a move actually uses before you teach it. A special Fire move on a physical attacker is a wasted slot.",
 "Old “bad” moves are suddenly good — Waterfall, Crunch, Shadow Claw, Iron Tail, Drain Punch and Poison Jab are all physical here."
]],
["h","4 · Badges gate your HMs and your obedience"],
["p","You cannot use an HM in the field until the matching badge is in the case, and traded Pokémon above your badge level will ignore you. This is the actual pacing of the game:"],
["table",{cols:["Badge","Leader","Unlocks in the field","Traded Pokémon obey to"],rows:[
 ["Zephyr","Falkner","Rock Smash","Lv 20"],
 ["Hive","Bugsy","Cut","Lv 30"],
 ["Plain","Whitney","Strength","Lv 40"],
 ["Fog","Morty","Surf","Lv 50"],
 ["Storm","Chuck","Fly","Lv 60"],
 ["Mineral","Jasmine","—","Lv 70"],
 ["Glacier","Pryce","Whirlpool","Lv 80"],
 ["Rising","Clair","Waterfall","Any level"],
 ["16 badges","Prof. Oak","Rock Climb","—"]
]}],
["tip","HM moves are still sticky in Gen 4 — you cannot overwrite them normally. The <b>Move Deleter lives in Blackthorn City</b>, next to the Pokémon Center, and will strip an HM off any Pokémon. The <b>Move Relearner</b> is also in Blackthorn and takes Heart Scales."],
["h","Status is stronger than it looks"],
["ul",[
 "<b>Sleep</b> lasts 1–5 turns in Gen 4 and the counter does not reset on switch — Hypnosis / Sing / Spore win fights outright.",
 "<b>Paralysis</b> cuts Speed by 75% (not 50% as in Gen 7+). Thunder Wave neuters a sweeper completely.",
 "<b>Burn</b> halves physical Attack. Will-O-Wisp is a legitimate answer to Machamp and to Bruno.",
 "Confusion damage is 50% self-hit chance. Swagger + Psych Up strategies are real here, but so is losing to Whitney’s Attract."
]],
["h","Two coin-flip mechanics that will ruin a run"],
["ul",[
 "<b>Focus Band / Quick Claw / Attract</b> — every one of these appears on a Gym Leader Pokémon at some point. Save state before a wall fight if you value your time.",
 "<b>Critical hits are 1/16</b> and ignore your defensive boosts. That is how Whitney’s Miltank ends things."
]]
]});

STAGES.push({
id:"core-team", ch:"core", tag:"Fundamentals", place:"Team planning",
title:"Picking a starter and building a six that clears Johto",
lede:"Johto has a genuinely thin early roster — Fire and Electric barely exist before the fourth badge — so team-building here is mostly about covering the region’s known potholes.",
body:[
["h","The starter decision"],
["table",{cols:["Starter","Line","The case for it","The cost"],rows:[
 ["<b>Cyndaquil</b>","Quilava → Typhlosion","The efficiency pick. Fire is nearly absent from Johto’s wild roster, so this is your only reliable answer to Bugsy, Jasmine and half the Elite Four. Big Special Attack, gets Flamethrower early enough to matter.","Bad matchups against Chuck, Clair and the entire Kanto Water block. Needs a partner that handles Rock and Water."],
 ["<b>Totodile</b>","Croconaw → Feraligatr","The balanced pick. Physical Water with Ice Fang and Crunch covers Clair, Pryce’s Piloswine and Lance’s dragons. Doubles as your Surf and Waterfall carrier, which frees a team slot.","Slow to come online, and it does nothing special against Whitney, Morty or Bugsy."],
 ["<b>Chikorita</b>","Bayleef → Meganium","The challenge run. Weak to Falkner, Bugsy, Morty, Jasmine and Pryce — five of eight Johto gyms — and its offensive typing is resisted almost everywhere.","Do not take this one. If you already have, set the toolbar selector to Chikorita and the guide will route you around it."]
]}],
["team","<b>Take Cyndaquil.</b> That is the recommendation — not a preference. Johto hands you Water, Flying, Ground and Electric for free from wild encounters, but it will not give you a usable Fire type for another twenty hours, and Fire is what beats Bugsy, Jasmine, Erika and Koga’s Forretress.<br><br>Already started with something else? Set the <b>starter selector in the toolbar</b> and every roster in this guide re-plans around it. Do not restart — all three finish the game."],
["h","A six that works, all catchable in Johto without trading"],
["catch",[
 {n:"Typhlosion", t:["Fire"], where:"Starter — New Bark Town", why:"Your special sweeper all game. Flamethrower via the Goldenrod Game Corner is the single biggest power spike available before badge five."},
 {n:"Gyarados", t:["Water","Flying"], where:"Red Gyarados, Lake of Rage — Lv 30, free, guaranteed", why:"Enormous Attack, arrives fully evolved right when the level curve gets steep, and carries Surf, Waterfall, Whirlpool and Strength. Intimidate blunts every physical gym leader."},
 {n:"Ampharos", t:["Electric"], where:"Mareep — Route 32, then Route 42/43", why:"Johto's only convenient Electric line. Answers the Water and Flying that Typhlosion cannot, and Thunder Wave turns hard fights into manageable ones."},
 {n:"Crobat", t:["Poison","Flying"], where:"Zubat — Dark Cave / Union Cave (evolves at high friendship)", why:"Absurdly fast, learns Fly, and Flying beats Bugsy, Chuck, Bruno and half of Karen's team. Friendship evolution pairs nicely with the Goldenrod haircut and Daisy's massages."},
 {n:"Heracross", t:["Bug","Fighting"], where:"Headbutt trees — Azalea Town, Routes 42/44/45/46", why:"The answer to Whitney, to Kanto's Normal walls, and to Karen's Dark types. Requires Headbutt from the Ilex Forest tutor, so it slots in right after badge two."},
 {n:"Quagsire", t:["Water","Ground"], where:"Wooper — Route 32 (night) and Union Cave", why:"Immune to Electric, resists Rock and Fire, and covers the Ground weakness on your Fire and Electric slots. Unspectacular but it plugs the exact holes this team has."}
]],
["h","The additions worth making — and the ones to skip"],
["ul",[
 "<b>Take it — Lapras</b> (Union Cave B2F, Fridays only, from badge four). Go on the first Friday after your fourth badge. It is bulkier than Quagsire and the best HM carrier in the game. If you miss the window, carry on without it — do not stall a week.",
 "<b>Take it — Umbreon</b> (Eevee gift from Bill in Goldenrod). Level it up at <i>night</i> with high friendship. Umbreon over Espeon: it is immune to Psychic, which walls Will and Sabrina outright, and it survives things Espeon does not. Use the Goldenrod haircut brothers daily to get there.",
 "<b>Skip it for Johto — Dragonite</b> (Dratini gift in Dragon’s Den after Clair). It evolves at 55, which is after the Elite Four. Take the gift, box it, and level it during Kanto for the Elite Four rematch.",
 "<b>Take it, but later — Tyranitar</b> (Larvitar, Mt. Silver). Post-game only. Catch it on your first climb and level it before Red: Rock is 4× on his Charizard.",
 "<b>Skip them for the main run — Steelix, Scizor, Gengar, Machamp, Alakazam.</b> All excellent, all need a trade. Set up the two-instance trick for the Pokédex, not for your playthrough team — the six below already beat every gym.",
 "<b>Togekiss</b> is <i>not</i> available: the Shiny Stone is post-game, and in Gen 4 Togekiss is Normal/Flying, not Fairy."
]],
["h","The HM problem, solved once"],
["p","Eight field moves, six team slots. The trick is to let real attackers carry the water HMs and to keep exactly one disposable carrier for the rest."],
["table",{cols:["HM","Where you get it","Who should carry it"],rows:[
 ["HM01 Cut","Ilex Forest — from the charcoal maker after you return his Farfetch’d","The mule (Furret is the classic — Sentret is on Routes 29–31)"],
 ["HM02 Fly","Cianwood City — Chuck’s wife, after the gym","Crobat, or a Noctowl/Pidgeot mule"],
 ["HM03 Surf","Ecruteak Dance Theatre — after the Kimono Girls’ Rocket","Gyarados or Lapras — Surf is a genuinely good attack"],
 ["HM04 Strength","Route 42 — Hiker outside Mt. Mortar","Gyarados, Quagsire or the mule"],
 ["HM05 Whirlpool","Rocket HQ — Lance gives it after the generator","Gyarados or Lapras"],
 ["HM06 Rock Smash","Route 36 — man east of the Sudowoodo tree","The mule (and it breaks rocks hiding Heart Scales)"],
 ["HM07 Waterfall","Ice Path 1F","Gyarados or Lapras — also a strong physical STAB"],
 ["HM08 Rock Climb","Pallet Town — Prof. Oak, after all 16 badges","Ampharos or Donphan — <b>not</b> Furret, which cannot learn it"]
]}],
["tip","Build the mule early. A <b>Furret</b> caught on Route 29 covers Cut, Strength, Rock Smash, Surf and Whirlpool — five of the eight. It <i>cannot</i> learn Fly, Waterfall or Rock Climb, so plan those three onto real team members: Fly on Crobat, Waterfall on Gyarados, and Rock Climb on Ampharos or a Donphan."],
["mount","planner"]
]});

STAGES.push({
id:"core-econ", ch:"core", tag:"Fundamentals", place:"Money, XP, items",
title:"The economy: where levels, money and good moves actually come from",
lede:"HeartGold gives you no Exp. Share until roughly the seventh badge. Knowing the real sources of progress is what keeps this from becoming a grind.",
body:[
["h","Experience"],
["ul",[
 "<b>There is no early Exp. Share.</b> You get it from Mr. Pokémon on Route 30 in exchange for the <b>Red Scale</b> the Red Gyarados drops at Lake of Rage — that is badge seven territory. Plan on levelling your team by using it, not by parking a low-level mon.",
 "<b>Pokégear rematches are the main XP faucet.</b> Accept every trainer’s number, then answer their calls: they tell you when they want a rematch, and the same trainer levels up with you. The Route 39/38 and Route 42 trainers are the most convenient loops.",
 "<b>The Lucky Egg</b> is held by ~5% of wild <b>Chansey</b> on Kanto Routes 13/14/15 and in the Safari Zone Meadow. Bring a Thief user or a lot of patience. It is worth the detour before you grind for the Elite Four rematch.",
 "<b>Trainer House</b> in Viridian City can be battled once a day — good, fast XP late.",
 "Rare Candies show up in the Goldenrod lottery and the Pokéathlon shop."
]],
["h","Money"],
["ul",[
 "<b>Amulet Coin</b> — Goldenrod Department Store basement. Doubles prize money when the holder participates. Get it the first time you are in Goldenrod and never take it off.",
 "<b>Nuggets</b> — Team Rocket grunts drop them constantly through Slowpoke Well, the Rocket HQ and the Radio Tower. Sell them.",
 "<b>Rematch calls</b> against Kanto trainers pay far better than Johto ones. Once the Magnet Train runs, a Kanto lap is the fastest money in the game."
]],
["h","Voltorb Flip is the biggest power spike in the game"],
["p","In every non-Japanese release, the Game Corner slots were replaced with <b>Voltorb Flip</b> — a Minesweeper/Picross hybrid that is pure logic, not luck, once you learn it. It is also where the game hides its best mid-game moves:"],
["table",{cols:["Prize","Corner","Cost","Why it matters"],rows:[
 ["TM13 Ice Beam","Goldenrod","10,000 coins","Your answer to Clair, Lance and every Dragon and Ground type for the rest of the game"],
 ["TM24 Thunderbolt","Goldenrod","10,000 coins","Answers Gyarados, Lance’s Gyarados, and the entire Kanto Water block"],
 ["TM35 Flamethrower","Goldenrod","10,000 coins","Turns Typhlosion on properly; also the fix for Jasmine and Erika"],
 ["TM75 Swords Dance","Goldenrod","4,000 coins","Makes Heracross and Gyarados win fights they should lose"],
 ["Dratini","Goldenrod","2,100 coins","A second Dragonite project, well before Dragon’s Den"],
 ["TM68 Giga Impact","Celadon","15,000 coins","Late-game nuke"],
 ["TM29 Psychic","Celadon","10,000 coins","Cleans up Koga and the Fighting Dojo"]
]}],
["tip","Learn Voltorb Flip properly — the row/column numbers tell you exactly which tiles are safe, and a good player clears level 7 repeatedly. An hour of it around badge four buys Ice Beam <i>and</i> Flamethrower, which is worth more than ten levels."],
["h","Held items worth chasing early"],
["loot",[
 {k:"Item", n:"Amulet Coin", where:"Goldenrod Dept. Store basement", why:"Double prize money."},
 {k:"Item", n:"King’s Rock", where:"Slowpoke Well", why:"Flinch chance, and the Politoed / Slowking trade evolution item."},
 {k:"Item", n:"Leftovers", where:"Held by the Snorlax on Kanto Route 11", why:"The best passive item in the game. Catch the Snorlax, do not just KO it."},
 {k:"Item", n:"Macho Brace", where:"Held by the traded Machop “Muscle”, Goldenrod Dept. Store 4F", why:"EV training, if you go that far."},
 {k:"Item", n:"Metal Coat", where:"Held by the traded Magneton in the Kanto Power Plant", why:"Steelix and Scizor."},
 {k:"Item", n:"Exp. Share", where:"Mr. Pokémon, Route 30 — trade the Red Scale", why:"Bring an underlevelled sixth member up to the Elite Four."},
 {k:"Item", n:"Heart Scales", where:"Rock Smash rocks (Violet, Cianwood, Dark Cave), Route 32 hidden, Pokéathlon shop", why:"Currency for the Blackthorn Move Relearner — how you get good moves onto old Pokémon."}
]],
["do",[
 "Pick your starter and write down your intended six.",
 "Plan which Pokémon carries which HM before you are forced to improvise.",
 "Set a coin target for Voltorb Flip: 24,000 coins buys Ice Beam, Thunderbolt and Flamethrower."
]]
]});
</script>
<script>
/* ===================== JOHTO 1–8 ===================== */
STAGES.push({
id:"j01", ch:"johto", tag:"Stage 01", place:"New Bark Town · Routes 29–31 · Cherrygrove",
title:"The errand",
lede:"An hour of scripted setup. The only decisions that matter are your starter and how many Pokémon you bother to catch before the first gym.",
band:[{k:"Party level",v:"5 → 9"},{k:"Badges",v:"0"},{k:"New HMs",v:"none"}],
body:[
["p","Prof. Elm sends you to Mr. Pokémon on Route 30. Take the starter, take the Potion from the PC, and talk to your mother before you leave — she offers to bank your money, which is worth saying yes to."],
["h","Route order"],
["ul",[
 "<b>New Bark Town</b> → pick your starter in Elm’s lab.",
 "<b>Route 29</b> → <b>Cherrygrove City</b>. The old man walking around town gives you the <b>Map Card</b> for the Pokégear and a pair of Running Shoes come early — hold <kbd>B</kbd> permanently from here on.",
 "<b>Route 30</b> → <b>Mr. Pokémon’s house</b>. He hands you the <b>Mystery Egg</b>; Prof. Oak is inside and gives you the <b>Pokédex</b>.",
 "Back to Cherrygrove — Elm’s aide meets you with <b>five Poké Balls</b>, and your rival battles you at the town’s edge with the starter that beats yours.",
 "<b>Route 29 → New Bark</b>, report to Elm, then head north through Route 30 to <b>Route 31</b>."
]],
["h","Worth catching now"],
["catch",[
 {n:"Sentret", t:["Normal"], where:"Routes 29–31, day", why:"This is your HM mule. Furret learns Cut, Strength, Rock Smash, Surf and Whirlpool — five of the eight field moves on one body. It cannot learn Fly, Waterfall or Rock Climb."},
 {n:"Hoothoot", t:["Normal","Flying"], where:"Routes 29–31, night", why:"Temporary Flying coverage for the first two badges. Fly goes on Crobat later — box Hoothoot at Stage 3."},
 {n:"Bellsprout", t:["Grass","Poison"], where:"Routes 30–31, Sprout Tower", why:"Catch a spare: a trainer beside the Violet City Pokémon Center trades an Onix for one."},
 {n:"Spinarak", t:["Bug","Poison"], where:"Routes 30–31, night (HeartGold only)", why:"Version exclusive — grab one for the dex while you are here rather than trekking back."},
 {n:"Pidgey / Rattata / Caterpie / Weedle", t:["Normal"], where:"Routes 29–31", why:"Dex entries you will otherwise forget about for thirty hours."}
]],
["tip","Apricorn trees start on <b>Route 30</b> (green and pink). Shake every apricorn tree you pass from now on — Kurt in Azalea turns them into the best balls in the game, and they refill daily."],
["do",[
 "Choose your starter.",
 "Talk to Mom and let her save money for you.",
 {t:"Collect the Map Card in Cherrygrove.", sub:"Pokégear → Map is how you will navigate Johto’s spaghetti routes."},
 "Take the Mystery Egg from Mr. Pokémon and the Pokédex from Oak.",
 "Beat your rival in Cherrygrove.",
 "Catch a Sentret for the mule slot.",
 "Start shaking apricorn trees on Route 30."
]]
]});

STAGES.push({
id:"j02", ch:"johto", tag:"Stage 02", place:"Violet City · Sprout Tower",
title:"Zephyr Badge — Falkner",
lede:"An easy gym with one nasty trick: Falkner’s Pidgeotto carries a Mud-Slap that blinds you, and both his birds hold a berry.",
band:[{k:"Party level",v:"10 → 13"},{k:"Badge",v:"Zephyr"},{k:"Unlocks",v:"Rock Smash"}],
body:[
["h","Sprout Tower first"],
["p","The gym doors are open, but Sprout Tower to the north is worth clearing first: the sages give steady experience, your rival fights you on the top floor, and <b>Elder Li</b> hands over <b>TM70 Flash</b> — which you need for Dark Cave and, much later, Cerulean Cave."],
["catch",[
 {n:"Gastly", t:["Ghost","Poison"], where:"Sprout Tower, night", why:"If you plan to trade for a Gengar later, catch it now — Gastly is much rarer after Johto."},
 {n:"Zubat", t:["Poison","Flying"], where:"Dark Cave entrance (Route 31), Union Cave", why:"Crobat is one of the best Pokémon in this game and needs the longest friendship runway. Start it now."},
 {n:"Dunsparce", t:["Normal"], where:"Dark Cave", why:"Dex entry, and it is annoying to find later."}
]],
["loot",[
 {k:"TM70", n:"Flash", where:"Sprout Tower — Elder Li"},
 {k:"Item", n:"Miracle Seed / potions", where:"Sprout Tower floors"},
 {k:"Item", n:"Heart Scale", where:"Violet City — Rock Smash rocks, once you have the badge"}
]],
["boss",{
name:"Falkner", role:"Violet City Gym · Flying", badge:"Zephyr Badge",
team:[
 {m:"Pidgey", l:9, t:["Normal","Flying"], note:"Tackle, Sand-Attack. Harmless."},
 {m:"Pidgeotto", l:13, t:["Normal","Flying"], note:"Gust, Mud-Slap, Roost. The Mud-Slap accuracy drops are the whole fight — and it can heal."}
],
plan:[

id:"j06", ch:"johto", tag:"Stage 06", place:"Goldenrod Gym",
title:"Plain Badge — Whitney, and the Miltank problem",
lede:"The famous difficulty spike. It is not a hard fight once you understand that Rollout, Attract and Milk Drink are three separate problems that need three separate answers.",
band:[{k:"Party level",v:"18 → 21"},{k:"Badge",v:"Plain"},{k:"Unlocks",v:"Strength"}],
body:[
["boss",{
name:"Whitney", role:"Goldenrod City Gym · Normal", badge:"Plain Badge",
team:[
 {m:"Clefairy", l:17, t:["Normal"], note:"Pure <b>Normal</b> in Gen 4 — there is no Fairy type here. Doubleslap, Encore, Metronome. Encore can lock you into a status move."},
 {m:"Miltank", l:19, t:["Normal"], note:"Rollout, Attract, Stomp, Milk Drink. Holds a Lum Berry in some encounters. This is the wall."}
],
plan:[
 "<b>Rollout</b> doubles in power every consecutive hit and runs up to five turns. It is a <b>Rock</b> move: Geodude, Onix and Quagsire (Ground) resist or shrug it off. Rock Smashing a Geodude into your party for this one fight is a completely legitimate play.",
 "<b>Attract</b> only works on the opposite gender. Miltank is always female — so lead with a <b>female or genderless</b> Pokémon and the move does nothing. Your starter is most likely male; this is the single biggest tip for this fight.",
 "<b>Milk Drink</b> heals half its HP. You cannot win a damage race — you need burst. Fighting moves are 2×; Heracross with Brick Break, a Machop from the Goldenrod trade, or Rock Smash off anything will out-pace the healing.",
 "Failing all that: <b>paralyse it</b>. Thunder Wave from a Mareep cuts its Speed by 75% and gives you free turns.",
 "Kill the Clefairy quickly — Encore locking you into Growl or Leer while Rollout ramps is how runs die here."
],
reward:"TM45 Attract, the Plain Badge, and Strength."
}],
["h","Immediately after"],
["do",[
 "Beat Whitney.",
 {t:"Take the <b>SquirtBottle</b> from the flower shop next to the gym.", sub:"This is what wakes the Sudowoodo blocking Route 36. The game will not let you progress north without it."},
 "Check the Pokéathlon Dome — it opens after this badge.",
 "Buy your Voltorb Flip TMs if you have the coins."
]],
["team","With Strength in hand, your mule can now push boulders — Union Cave B2F, Slowpoke Well’s lower level and several Ruins of Alph chambers all open up. If you are collecting everything, a short backtrack here is cheaper than a long one later."]

 {n:"%S%", role:"vs Venusaur", st:"keep", w:"Fire is 2× on Venusaur, so Typhlosion earns its slot. Feraligatr and Meganium do not — bench them here and bring the Dragonite you levelled during Kanto instead."},
 {n:"Gyarados", t:["Water","Flying"], role:"Ice Beam body", st:"keep", w:"Still your Ice Beam carrier, and Intimidate softens Snorlax's Body Slam."}
],
notes:{cyndaquil:"Typhlosion handles Venusaur cleanly and threatens nothing else — but Blast Burn from the Frontier tutor makes it a genuine nuke for one turn.",
       totodile:"Feraligatr is resisted by Blastoise and Lapras both. Its best target is Charizard, and Tyranitar does that better.",
       chikorita:"Meganium is 2× effective on Lapras and Blastoise, which is more than either other starter manages here. Keep it in."}});


/* ---- the single next action for each stage ---- */
const NOW = {
 j01:"Run Elm's errand to Mr. Pokémon on Route 30. Catch a Sentret on Route 29 on the way, and a Hoothoot after dark.",

 j07:"Use the SquirtBottle on the Route 36 tree and <b>catch</b> Sudowoodo — do not knock it out. Then take HM06 Rock Smash and hunt an Abra.",

 j10:"Surf south to Cianwood, take the SecretPotion, beat Chuck with Crobat, then collect HM02 Fly from his wife outside the gym.",
 j11:"Open the Safari Zone and place your first blocks — it runs on a real-world clock, so starting it now costs you nothing. Then deliver the SecretPotion and beat Jasmine.",

 k01:"Grind to level 50 before you fight anything in Kanto. Then take the Poké Doll from the Vermilion Fan Club and beat Lt. Surge with Quagsire.",

};
Object.keys(NOW).forEach(k => { if (ROSTERS[k]) ROSTERS[k].now = NOW[k]; });

/* ---- attach a roster board to the top of every stage that has one ---- */
STAGES.forEach(s => { if (ROSTERS[s.id]) s.body.unshift(["roster", s.id]); });

/* ---- render ---- */
const PSTAT = {add:"Add here", keep:"Keep", swap:"Swap out", bench:"Bench this stage"};
function starterTok(str, nm){ return String(str).split("%S%").join(nm); }

function rosterHTML(id){
  const r = ROSTERS[id];
  if (!r) return "";
  const S = STARTERS[STARTER];
  const nm = (r.form && S[r.form]) ? S[r.form] : S.final;
  const slots = r.slots.filter(sl => !sl.only || sl.only.indexOf(STARTER) !== -1);
  const note = r.notes && r.notes[STARTER];

  return (r.now ? '<div class="donow"><span class="lbl">Do this now</span><p>' + starterTok(r.now, nm) + '</p></div>' : "") +
    '<div class="party">' +
    '<div class="ph"><h4>Your party at this point</h4>' +
      '<span class="lv">target Lv ' + esc(r.lv) + '</span>' +
      '<span class="who">' + esc(nm) + ' run</span></div>' +
    (r.sum ? '<p class="psum">' + starterTok(r.sum, nm) + '</p>' : "") +
    (note ? '<div class="pnote"><span class="lbl">If you took ' + esc(S.base) + '</span><p>' + starterTok(note, nm) + '</p></div>' : "") +
    '<div class="pgrid">' + slots.map(sl => {
      const isStarter = sl.n === "%S%";
      const name = isStarter ? nm : sl.n;
      const types = isStarter ? S.t : (sl.t || []);
      return '<div class="pslot ' + sl.st + '">' +
        '<span class="pst">' + PSTAT[sl.st] + '</span>' +
        '<div class="pn">' + esc(name) + ' ' + tpills(types) + '</div>' +
        '<div class="prole">' + esc(sl.role) + '</div>' +
        (sl.w ? '<div class="pw">' + starterTok(sl.w, nm) + '</div>' : "") +
      '</div>';
    }).join("") + '</div></div>';
}

function renderRosters(){
  document.querySelectorAll("[data-roster]").forEach(el => {
    el.innerHTML = rosterHTML(el.dataset.roster);
  });
  document.querySelectorAll("[data-starter-name]").forEach(el => {
    el.textContent = STARTERS[STARTER].base;
  });
}

function setStarter(k){
  if (!STARTERS[k]) return;
  STARTER = k;
  try { localStorage.setItem(KEY + ":starter", k); } catch (e) {}
  renderRosters();
}

</script>
<script>
/* ===================== WIDGETS ===================== */

/* — TM / HM index — */
WIDGETS.tmindex = function(el){
  const rows = MACHINES.map(m => {
    const id = 'mach-' + m[0];
    const on = !!DONE[id];
    return '<tr class="doneRow' + (on ? ' isdone' : '') + '" data-search="' + esc((m[0] + ' ' + m[1] + ' ' + m[2] + ' ' + m[3]).toLowerCase()) + '">' +
      '<td><input class="have" type="checkbox" data-k="' + id + '"' + (on ? ' checked' : '') + ' aria-label="Have ' + esc(m[0]) + '"></td>' +
      '<td class="num">' + esc(m[0]) + '</td>' +
      '<td class="mon">' + esc(m[1]) + '</td>' +
      '<td>' + tpill(m[2]) + '</td>' +
      '<td class="mv">' + esc(m[3]) + '</td></tr>';
  }).join('');
  el.innerHTML =
    '<div class="reftable"><div class="rh">' +
      '<input id="tmfilter" type="search" placeholder="Filter by number, move, type or place…" autocomplete="off">' +
      '<span class="pct mono" id="tmcount"></span>' +
    '</div><div class="tblwrap"><table><thead><tr><th>Have</th><th>#</th><th>Move</th><th>Type</th><th>Where it comes from</th></tr></thead>' +
    '<tbody id="tmbody">' + rows + '</tbody></table></div></div>';

  const body = el.querySelector('#tmbody');
  const count = el.querySelector('#tmcount');
  function tally(){
    const have = MACHINES.filter(m => DONE['mach-' + m[0]]).length;
    count.textContent = have + ' / ' + MACHINES.length;
  }
  tally();
  body.addEventListener('change', tally);
  el.querySelector('#tmfilter').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    body.querySelectorAll('tr').forEach(tr => {
      tr.classList.toggle('rowhide', !!q && !tr.dataset.search.includes(q));
    });
  });
};

/* — Weekly day board — */
WIDGETS.days = function(el){
  el.innerHTML = '<div class="dayboard" id="dayboard"></div>';
  drawDays();
};
function drawDays(){
  const board = document.getElementById('dayboard');
  if (!board) return;
  const sel = document.getElementById('daypick');
  const chosen = sel && sel.value !== 'today' ? parseInt(sel.value, 10) : new Date().getDay();
  board.innerHTML = DAYS.map((d, i) =>
    '<div class="daycard' + (i === chosen ? ' today' : '') + '"><h4>' + esc(d[0]) +
    (i === chosen ? '<span class="mk">selected</span>' : '') + '</h4><ul>' +
    d[1].map(x => '<li>' + x + '</li>').join('') + '</ul></div>').join('');
}

/* — Gen IV type calculator — */
WIDGETS.types = function(el){
  const opts = TYPES.map(t => '<option value="' + t + '">' + t + '</option>').join('');
  el.innerHTML =
    '<div class="planner"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">' +
      '<label style="font-family:\'DM Mono\',monospace;font-size:11px;color:var(--ink3)">Attacking move<br><select class="daypick" id="atkT">' + opts + '</select></label>' +
      '<label style="font-family:\'DM Mono\',monospace;font-size:11px;color:var(--ink3)">Defender type 1<br><select class="daypick" id="defA">' + opts + '</select></label>' +
      '<label style="font-family:\'DM Mono\',monospace;font-size:11px;color:var(--ink3)">Defender type 2<br><select class="daypick" id="defB"><option value="">— none —</option>' + opts + '</select></label>' +
    '</div><div id="typeout" style="margin-top:14px"></div></div>';
  const out = el.querySelector('#typeout');
  function calc(){
    const a = el.querySelector('#atkT').value;
    const d1 = el.querySelector('#defA').value;
    const d2 = el.querySelector('#defB').value;
    const defs = d2 ? [d1, d2] : [d1];
    const m = eff(a, defs);
    const label = m === 0 ? 'No effect' : m >= 4 ? 'Devastating' : m >= 2 ? 'Super effective' : m <= 0.25 ? 'Almost nothing' : m < 1 ? 'Resisted' : 'Neutral';
    const cls = m >= 2 ? 'ok' : (m < 1 ? 'bad' : '');
    out.innerHTML = '<div class="cvcell ' + cls + '" style="max-width:320px"><div class="cvt">' +
      esc(a) + ' → ' + esc(defs.join(' / ')) + '</div><div class="cvv" style="font-size:20px">×' + m + ' — ' + label + '</div></div>';
  }
  el.querySelectorAll('select').forEach(s => s.addEventListener('change', calc));
  calc();
};

/* — Team planner — */
let TEAM = [];
try { TEAM = JSON.parse(localStorage.getItem(KEY + ':team') || '[]') || []; } catch (e) { TEAM = []; }
WIDGETS.planner = function(el){
  el.innerHTML =
    '<div class="planner"><h3 style="margin-top:0">Team planner</h3>' +
    '<p style="font-size:15px;color:var(--ink2);margin:0 0 4px;max-width:66ch">Pick up to six. The panel below counts how many of your team each attacking type hurts, and flags the types nothing on your team hits hard.</p>' +
    '<div class="slots" id="slots"></div>' +
    '<div class="pool" id="pool"></div>' +
    '<div id="coverage"></div></div>';
  drawPlanner(el);
  el.addEventListener('click', e => {
    const add = e.target.closest('[data-add]');
    const rm = e.target.closest('[data-rm]');
    if (add && TEAM.length < 6 && !TEAM.includes(add.dataset.add)) TEAM.push(add.dataset.add);
    else if (rm) TEAM = TEAM.filter(n => n !== rm.dataset.rm);
    else return;
    try { localStorage.setItem(KEY + ':team', JSON.stringify(TEAM)); } catch (err) {}
    drawPlanner(el);
  });
};
function typesOf(name){ const p = POOL.find(x => x[0] === name); return p ? p[1] : []; }
function drawPlanner(el){
  const slots = el.querySelector('#slots');
  slots.innerHTML = Array.from({length:6}, (_, i) => {
    const n = TEAM[i];
    if (!n) return '<div class="slot"><span class="empty">slot ' + (i + 1) + '</span></div>';
    return '<div class="slot filled"><button class="x" data-rm="' + esc(n) + '" aria-label="Remove ' + esc(n) + '">×</button>' +
      '<div class="sn">' + esc(n) + '</div><div class="st">' + tpills(typesOf(n)) + '</div></div>';
  }).join('');

  el.querySelector('#pool').innerHTML = POOL.map(p =>
    '<button data-add="' + esc(p[0]) + '"' + (TEAM.includes(p[0]) || TEAM.length >= 6 ? ' disabled' : '') + '>' + esc(p[0]) + '</button>').join('');

  const cov = el.querySelector('#coverage');
  if (!TEAM.length){ cov.innerHTML = ''; return; }
  const members = TEAM.map(n => typesOf(n));
  const weak = TYPES.map(t => [t, members.filter(m => eff(t, m) >= 2).length]);
  const gaps = TYPES.filter(d => !TEAM.some(n => typesOf(n).some(s => eff(s, [d]) >= 2)));

  cov.innerHTML =
    '<h3 style="margin-bottom:6px">Defensive exposure — how many of your six each type hits hard</h3>' +
    '<div class="cover">' + weak.map(w =>
      '<div class="cvcell ' + (w[1] >= 3 ? 'bad' : w[1] === 0 ? 'ok' : '') + '"><div class="cvt">' + w[0] +
      '</div><div class="cvv">' + w[1] + ' of ' + TEAM.length + '</div></div>').join('') + '</div>' +
    '<h3 style="margin-bottom:6px">Types nothing on your team hits for 2× with its own typing</h3>' +
    '<p style="font-size:15.5px;margin:0">' + (gaps.length
      ? gaps.map(tpill).join(' ') + '<br><span style="color:var(--ink3);font-size:14px">This is a same-type check only — a TM can plug any of these. Ice Beam, Thunderbolt and Flamethrower between them cover most gaps a Johto team has.</span>'
      : '<span style="color:var(--good)">Nothing — your six cover every type with same-type moves alone.</span>') + '</p>';
}

/* — Progress backup — */
WIDGETS.backup = function(el){
  el.innerHTML =
    '<details class="backup"><summary>Backup / restore your ticks</summary>' +
    '<textarea id="bkText" spellcheck="false" aria-label="Progress backup data"></textarea>' +
    '<div class="rowbtns"><button class="tbtn" id="bkCopy">Copy backup</button>' +
    '<button class="tbtn" id="bkLoad">Restore from box</button>' +
    '<button class="tbtn" id="bkClear">Clear all progress</button></div>' +
    '<p style="font-size:14px;color:var(--ink3);margin:10px 0 0">Ticks are stored in this browser only. Paste the string into a note if you plan to open the guide on another device.</p></details>';
  const ta = el.querySelector('#bkText');
  ta.value = JSON.stringify({done:DONE, team:TEAM});
  el.querySelector('#bkCopy').addEventListener('click', () => {
    ta.select();
    try { navigator.clipboard.writeText(ta.value); } catch (e) { document.execCommand('copy'); }
    el.querySelector('#bkCopy').textContent = 'Copied';
    setTimeout(() => { el.querySelector('#bkCopy').textContent = 'Copy backup'; }, 1400);
  });
  el.querySelector('#bkLoad').addEventListener('click', () => {
    try {
      const parsed = JSON.parse(ta.value);
      DONE = parsed.done || {};
      TEAM = parsed.team || [];
      persist();
      localStorage.setItem(KEY + ':team', JSON.stringify(TEAM));
      location.reload();
    } catch (e) {
      alert('That is not a valid backup string.');
    }
  });
  el.querySelector('#bkClear').addEventListener('click', () => {
    if (!confirm('Clear every tick and your saved team? This cannot be undone.')) return;
    DONE = {}; TEAM = [];
    persist();
    try { localStorage.removeItem(KEY + ':team'); } catch (e) {}
    location.reload();
  });
};

/* ===================== DAY SELECT + BOOT ===================== */
(function(){
  const sel = document.getElementById('daypick');
  const names = DAYS.map(d => d[0]);
  const today = new Date().getDay();
  sel.innerHTML = '<option value="today">Today · ' + names[today] + '</option>' +
    names.map((n, i) => '<option value="' + i + '">' + n + '</option>').join('');
  const sp = document.getElementById('starterpick');
  sp.innerHTML = Object.keys(STARTERS).map(k =>
    '<option value="' + k + '"' + (k === STARTER ? ' selected' : '') + '>Starter · ' + STARTERS[k].base + '</option>').join('');
  sp.addEventListener('change', e => setStarter(e.target.value));

  sel.addEventListener('change', () => {
    drawDays();
    const s = document.getElementById('ref-days');
    if (s && !s.classList.contains('hide')) s.scrollIntoView({behavior:'smooth', block:'start'});
  });
  boot();
})();
</script>
